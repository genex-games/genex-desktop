# The game's manifest: the only build input this folder declares. The studio reads it as data and
# writes the cargo manifest and lock itself, so there is no Cargo.toml here. Optional sections
# (`world_size`, `save_name`, `[crates]` from the reviewed list, `[[wgsl]]` extension sources and
# `[gpu] native_features`) are listed in docs/api/genex-toml.md; any other key is refused.
[game]
title = "__GAME_TITLE__"
# The game fills any window, as `.fit(Fit::Expand)` in main.rs (keep the two alike):
# letterbox keeps black bars around a fixed picture (docs/api/ctx.md).
fit = "expand"

# How the game is drawn (docs/api/rendering.md). The quality is the device's: desktops and
# phones each start on their own class's preset and the person can change it in the settings
# panel. The look is the game's, the same on every device: a filmic curve with auto exposure and a
# light ground haze that fades the far floor into the horizon (thin enough to leave the near scene clear).
# AgX's punchy look adds contrast and colour about middle grey without moving it; the exposure sits
# half an EV up, as for any sunlit scene, so the sunlit floor reads bright and the floor in the
# block's shadow, lit by the blue sky alone, reads as a blue-grey.
[render]
form_factors = ["desktop", "mobile"]
preset = "auto"

[render.look]
tonemapper = "agx-punchy"
exposure = "auto"
ev_compensation = 0.5
fog_density = 0.002

# Game systems switched off stay out of the build, which keeps the web build small; their calls
# still compile and are refused. Set `enabled = true` before using one (docs/api/genex-toml.md).
# Sounds and music: gfx.sound and ctx.audio (docs/api/audio.md). Off, every sound is missing
# `audio-disabled`.
[audio]
enabled = false

# Walkers that find paths: game.navigation and sim.nav (docs/api/navigation.md).
[nav]
enabled = false

# A big world streamed in cells around the player: game.streaming (docs/api/streaming.md).
[streaming]
enabled = false

# Animated characters: gfx.character and the Animator (docs/api/animation.md).
[animation]
enabled = false
