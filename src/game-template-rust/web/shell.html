<html lang="en">

    <meta charset="utf-8" />

    <title>__GAME_TITLE__</title>
    <link rel="icon" href="data:," /><!--__NET_BRIDGE__-->
    <!--
      The web shell of a rust-wgpu game: the studio's page around the browser build, index.html
      beside game.js and game_bg.wasm (the Rust lane's web branch, src/main/rust-build-web.ts,
      writes it with the game's title).

      WebGPU is the minimum; there is no fallback renderer. Before the game's module is fetched the
      shell checks for navigator.gpu, an adapter, and adapter limits at WebGPU's defaults; then
      studio_boot runs the renderer's own floor check. Any refusal shows the "needs WebGPU" page
      (its copy is the MESSAGE object below) with the typed code gpu-unsupported, and the game never
      starts. The refusal is reported where the host and the prober read a page: window.__studio is
      bound with only state(), which answers {error: "gpu-unsupported", volatile: {gpu: {reason,
      limit}}}, and window.GenexShell.status carries the same.

      Assets: a browser cannot list a folder, so the build writes assets.json (the asset map) beside
      the page. Before studio_boot the shell hands the map to studio_assets_plan with the adapter's
      texture facts (its texture-compression-* features and whether the page is a phone's, by the
      renderer's own rule), so the module plans one of a texture's family files, the one this
      adapter samples; it fetches each file planned from assets/ (never a URL outside that folder,
      never more bytes than planned) and hands it to studio_assets_preload, which admits it only at
      the recorded length and digest. The loading screen counts the planned files, and
      window.GenexShell.adapter carries the facts. Each step is bound only when the module exports it.
      Every fetch, before the first frame or while playing, is refused (asset-outside) when a
      redirect lands it outside assets/ or on another origin; nothing it carried is admitted.

      Streaming (game systems STR-14b): the plan holds only the map's boot and sim groups (a cell
      pack's index, everything outside the streamed groups). A pack's cells and terrain tiles and a
      named group's files are planned to arrive while playing, but none is fetched yet (the runtime
      wants none, so studio_assets_wanted answers nothing), so a game with a web build loads what it
      needs up front. Each frame, before the
      game's, the shell hands the module the pieces fetched since (studio_assets_arrived, oldest first, at most
      STREAM_HANDOFF_BYTES a frame but always one), then asks studio_assets_wanted for the pieces
      the game wants now and fetches each with a Range request, at most ASSET_FETCHES at once. A
      server that ignores Range answers the whole file, which is read up to the piece's end and
      sliced. A piece over STREAM_FETCH_MAX_BYTES is refused unfetched (asset-too-large); a refused
      fetch or a piece the module refuses is logged and the game plays on. Fetched bytes wait in the
      page until handed over, so the module's memory (which never shrinks) holds only what it took.
      window.GenexShell.streaming counts them: queued, open, held (heldBytes, heldMost), fetched and
      refused.

      Multiplayer (game systems MP-5a): a [net] game's game.js imports the relay client's bridge by
      its bare name, @genex-ai/multiplayer/bridge. Only that build's page carries, in its head where
      the build puts it, an import map resolving the name to ./mp/bridge.mjs (the build's shim)
      and a classic script loading mp/bridge.global.js (the pinned bridge) before any module; both
      are in the page's own folder, on its origin, outside assets/ and the asset map. Every other
      build's page has neither. The pipeline dry boot's worker has no import map, so a [net] game's
      dry boot is refused and its pipelines compile as the boot asks.

      A boot that fails after that (the module, its wasm, the saves preload, an asset or
      studio_boot throws) shows the "couldn't start" card with the typed code boot-failed, never an empty stage, and
      binds window.__studio with only state(), which answers {error: "boot-failed", volatile:
      {boot: {reason}}}.

      Device hints: studio_boot gets the page's hints as JSON (maxTouchPoints, a coarse pointer, the
      screen's short side in CSS pixels, and deviceMemory, hardwareConcurrency and
      userAgentData.mobile where the browser exposes them). The renderer classifies the browser
      from them (a desktop or a phone class, and its memory budget); a page that sends none is
      read as a phone.

      Saves: the game's synchronous save/load go to an in-memory mirror inside the module. The
      game's IndexedDB database (version 2) keeps each file's bytes in the store "files" and its
      byte length in "sizes"; a version-1 database (files only) gains the sizes in its upgrade
      transaction. Before studio_boot starts the game (its first reset), the shell fills the mirror
      from it. A module that keeps slot bodies lazily (it exports studio_saves_index) gets every
      file but the .sav ones whole and the .sav ones by name and size only; after each frame the
      shell reads the bodies a load asked for (studio_saves_requests) and hands them over
      (studio_saves_provide, undefined for a file the store does not keep). Files saved since are
      written back write-behind, with their sizes, when the page is idle, hidden or left
      (GenexShell.flushSaves() forces one); files the module removed (studio_saves_take_removed)
      are deleted from both stores in the same transaction. When the page is hidden or left, a
      module that exports studio_suspend_save writes its suspend autosave first, once per hide. A
      write the browser refuses stays pending, state().error says save-quota (or save-unavailable
      without IndexedDB) and the page shows a notice. After the preload the shell asks for
      persistent storage (navigator.storage.persist()) and tells the module whether it got it
      (studio_saves_persistent; refused, rejected or no IndexedDB is false).

      Page contract: window.__studio (version 1) as the C++ web shell's. Every verb goes through the
      one studio_call export (genex-studio's Studio::web(): the {id:null, ok, op, result} envelope
      the C++ webCall answers, the shared ops only) and is bound with the C++ shell's VERBS table and
      page shapes. renderSettings({set}) is the native renderSettings verb, and a change the game
      refuses answers {__refused: code}, which the studio reads as the native refusal.
      capture(camera) draws that view, awaits studio_capture (top-down BGRA from the world target,
      never the canvas) and hands the PNG to the studio's capture shim
      (window.__studioCapture), as the C++ shell does. Each is bound only when its export exists
      (studio_call for the verbs, studio_capture for capture), as the C++ shell binds each verb. The
      runtime's spike shell (native/genex-rust/web/shell.html) adds captureRaw() and selfTest(); a
      game's page has neither. window.GenexShell.status = {state: "starting" | "running" |
      "unsupported" | "failed", code, reason, limit, receipt}.

      Loading (renderer pass 2, owner decision D11): from the first paint until the game's first
      lit frame the page shows its loading screen (#loading: the game's title and logo, a spinner and
      a bar the compositor animates, the stage in words), styled by the game's [render.loading]
      table (the build writes its title, colours and logo into the page). Each step reports progress as a "genex:progress" event on window and in
      GenexShell.progress = {stage, done, total}, stages in this order: wasm (bytes of bytes),
      assets (files of files), device, pipelines (n of m), frame, ready (the loading screen leaves).
      A boot whose progress stops for BOOT_STALL_MS shows the "taking too long" card with the typed
      code boot-timeout, its reason the stage it stopped at (state() answers the code as for
      boot-failed). Pipelines: Chrome compiles a synchronous createRenderPipeline on its GPU thread,
      which also composites the page, so a cold start's compiles froze every frame for seconds. The
      shell therefore boots the game once more first in a worker (the dry boot: shader modules are
      stand-ins, pipelines are recorded and answered with a placeholder, textures are 1x1 and
      nothing is uploaded or submitted), then asks the real device for each recorded pipeline with
      create*PipelineAsync (compiled off that thread, counted n of m) before the game's own boot
      runs, whose synchronous calls then find them compiled. A dry boot that fails or takes longer
      than RECORD_TIMEOUT_MS is skipped: the boot then counts the pipelines it creates.

      Frames: the canvas follows its displayed size from the moment it is shown (a resize, or the
      Live view getting its size while studio_boot still runs). Each animation frame feeds the game
      whole refreshes of the display (its rate measured from the frame intervals), not the frame's
      jittery time, so the sim's 60 Hz ticks land on every second refresh of a 120 Hz display. A
      frame the module refuses with device-lost (the browser reset its GPU) flushes the saves and
      shows a card with that code (status failed); any other refusal is frame-failed.

      Crash reports (game systems CRASH-3): a Rust panic goes through genex-crash's hook, which hands
      the shell one genex-crash/1 record (GenexShell.crash), then logs the console text it always
      logged; the trap that ends the panic is not recorded again. A WebAssembly trap with no panic
      before it (from a frame, a verb, window.onerror or an unhandled rejection) is the shell's own
      wasm-trap record with the engine's wasm-function frames; the game's device lost (any reason
      but destroyed) is a device-lost record beside the device-lost card, and an uncaptured GPU
      error a gpu-validation record that is not fatal (at most GPU_ERROR_RECORDS_MAX distinct ones).
      Records are kept in the game's IndexedDB database genex-crashes:<game> (the module names it,
      studio_crash_database), CRASH_RECORDS_KEPT at most, the oldest pruned, and survive a reload;
      window.__studio.crashes() answers them newest first (a promise), on every page contract, the
      failed and unsupported ones too. After a fatal crash the module is never called again (its
      state is mid-frame). window.__studio.profile(request) is the dev profile verb through
      studio_call, a refusal answered {__refused: code} as renderSettings (the web answers
      unknown-op: an export serves the same page). window.__studio.reloadAssets({files}) is Live's
      asset swap, bound only when the module exports studio_assets_replace: it fetches again only
      the files named, swaps each into the module (which checks the host's FNV-1a 64), then sends
      the reloadAssets op.

      Input: keys while the canvas has focus, all released at once when the canvas, the window or
      the page loses it (their keyups would go elsewhere); Mouse1 held from pointerdown to pointerup
      with the pointer (a click no tick saw is also sent as a tap), the pointer's movement as look
      while Mouse1 is held or the pointer is locked to the canvas, the wheel in pixels, and real
      gamepads in the browser's standard mapping with their Gamepad.id (so the game can tell the
      pad's family), polled each animation frame. Where the browser offers the keyboard's layout
      map (Chromium), its key labels are sent once, for display only.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --page: #f4f1ea;
        --card: #ffffff;
        --ink: #1d1f24;
        --muted: #5b606b;
        --rule: #dcd6ca;
        --accent: #2b6cb0;
        --warn: #9a4b00;
        --stage: #12141c;
        --radius: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --page: #12141c;
          --card: #1c1f29;
          --ink: #eceae4;
          --muted: #a3a7b2;
          --rule: #2e3240;
          --accent: #7fb2ec;
          --warn: #f0b46a;
        }
      }
      :root[data-theme="dark"] {
        --page: #12141c;
        --card: #1c1f29;
        --ink: #eceae4;
        --muted: #a3a7b2;
        --rule: #2e3240;
        --accent: #7fb2ec;
        --warn: #f0b46a;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--stage);
        color: var(--ink);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        outline: none;
        touch-action: none;
      }
      #game[hidden] {
        display: none;
      }
      body.unsupported {
        background: var(--page);
        overflow: auto;
      }
      #unsupported {
        box-sizing: border-box;
        max-width: 38rem;
        margin: 0 auto;
        padding: 12vh 16px 48px;
      }
      #unsupported[hidden] {
        display: none;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--rule);
        border-radius: var(--radius);
        padding: 28px 28px 20px;
      }
      .card h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
        line-height: 1.25;
        text-wrap: balance;
      }
      .card h2 {
        margin: 20px 0 6px;
        font-size: 0.8rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .card p,
      .card li {
        color: var(--ink);
      }
      .card ul {
        margin: 0;
        padding-left: 1.2rem;
      }
      .card .excluded {
        color: var(--muted);
        font-size: 0.92rem;
      }
      .card footer {
        margin-top: 20px;
        padding-top: 12px;
        border-top: 1px solid var(--rule);
        color: var(--muted);
        font-size: 0.85rem;
        overflow-wrap: anywhere;
      }
      .card code,
      #save-notice code {
        font: 0.85rem ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--accent);
      }
      #save-notice {
        position: fixed;
        left: 50%;
        bottom: max(16px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        box-sizing: border-box;
        width: max-content;
        max-width: calc(100vw - 32px);
        padding: 10px 14px;
        background: var(--card);
        color: var(--ink);
        border: 1px solid var(--rule);
        border-left: 4px solid var(--warn);
        border-radius: 10px;
        font-size: 0.9rem;
        line-height: 1.4;
        box-shadow: 0 6px 24px rgb(0 0 0 / 0.25);
        pointer-events: none;
      }
      #save-notice[hidden] {
        display: none;
      }
      /* The loading screen: lit from the first paint, every motion a transform the compositor runs. */
      #loading {
        --loading-bg: __LOADING_BACKGROUND__;
        --loading-accent: __LOADING_ACCENT__;
        --loading-text: __LOADING_TEXT__;
        position: fixed;
        inset: 0;
        z-index: 2;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
        background-color: var(--loading-bg);
        background-image: radial-gradient(
          120% 85% at 50% 38%,
          color-mix(in srgb, var(--loading-accent) 24%, var(--loading-bg)) 0%,
          var(--loading-bg) 72%
        );
        color: var(--loading-text);
        transition: opacity 280ms ease;
        /* It only shows: a press goes to the game beneath once the game listens. */
        pointer-events: none;
      }
      #loading.leaving {
        opacity: 0;
      }
      #loading[hidden] {
        display: none;
      }
      .loading-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        max-width: min(32rem, 100%);
        text-align: center;
      }
      #loading-logo {
        max-width: min(240px, 60vw);
        max-height: 120px;
        object-fit: contain;
      }
      #loading-title {
        margin: 0;
        font-size: clamp(1.25rem, 4vw, 1.9rem);
        font-weight: 650;
        line-height: 1.2;
        text-wrap: balance;
        overflow-wrap: anywhere;
      }
      .loading-spinner {
        width: 40px;
        height: 40px;
        box-sizing: border-box;
        border-radius: 50%;
        border: 3px solid color-mix(in srgb, var(--loading-text) 16%, transparent);
        border-top-color: var(--loading-accent);
        animation: genex-spin 0.9s linear infinite;
        will-change: transform;
      }
      .loading-bar {
        width: min(280px, 70vw);
        height: 4px;
        border-radius: 2px;
        overflow: hidden;
        background: color-mix(in srgb, var(--loading-text) 14%, transparent);
      }
      .loading-bar [data-genex-bar] {
        height: 100%;
        background-color: var(--loading-accent);
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 240ms ease-out;
        will-change: transform;
      }
      #loading-stage {
        margin: 0;
        min-height: 1.5em;
        font-size: 0.9rem;
        color: color-mix(in srgb, var(--loading-text) 72%, transparent);
        font-variant-numeric: tabular-nums;
      }
      @keyframes genex-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loading-spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0" aria-label="Game" hidden></canvas>
    <main id="unsupported" hidden>
      <section class="card" role="alert" aria-labelledby="unsupported-title"></section>
    </main>
    <div id="save-notice" role="status" aria-live="polite" hidden></div>
    <div id="loading" role="status" aria-live="polite" aria-busy="true">
      <div class="loading-card">
        <!--__LOADING_LOGO__-->
        <h1 id="loading-title">__LOADING_TITLE__</h1>
        <div class="loading-spinner" aria-hidden="true"></div>
        <div class="loading-bar" aria-hidden="true"><div data-genex-bar></div></div>
        <p id="loading-stage">Loading</p>
      </div>
    </div>
    <script type="module">
      /** Every word the shell shows. */
      const MESSAGE = {
        unsupported: {
          title: "This game needs WebGPU",
          body: "Your browser or graphics hardware does not offer WebGPU, which this game draws with. There is no fallback, so the game cannot start here.",
          supportedHeading: "Supported browsers",
          supported: [
            "Chrome or Edge on Windows, macOS and ChromeOS",
            "Chrome on Android, on supported GPUs",
            "Safari 26 on macOS, iOS and iPadOS",
            "Firefox 141 or later on Windows, Firefox 147 or later on macOS",
          ],
          excludedHeading: "Not supported",
          excluded:
            "Firefox on Linux and Android, Safari before 26, Chrome on Linux outside its WebGPU GPU list, and any browser with WebGPU turned off.",
          codeLabel: "Code",
        },
        failed: {
          title: "This game couldn’t start",
          body: "Something went wrong while the game was loading, so it isn’t running. Reload to try again; if it keeps happening, the game’s build needs a fix.",
          codeLabel: "Code",
        },
        timeout: {
          title: "This game is taking too long to start",
          body: "Loading stopped making progress, so it was stopped. Reload to try again; on a slow connection or an older device it can take a few tries.",
          codeLabel: "Code",
        },
        loading: {
          wasm: "Downloading the game",
          assets: "Loading assets",
          device: "Starting the graphics",
          pipelines: "Preparing shaders",
          frame: "Drawing the first frame",
          ready: "Ready",
          count: (done, total) => `${done} of ${total}`,
          megabytes: (done, total) => `${(done / 1e6).toFixed(1)} of ${(total / 1e6).toFixed(1)} MB`,
        },
        deviceLost: {
          title: "The game stopped drawing",
          body: "The browser reset its graphics, so the game can’t draw any more. Your progress was saved. Reload the page to keep playing.",
          codeLabel: "Code",
        },
        saves: {
          "save-quota": "Progress isn’t being saved: this browser’s storage for the game is full.",
          "save-unavailable": "Progress isn’t being saved: this browser keeps no storage for the game.",
        },
      };
      /** WebGPU's default limits (wgpu's Limits::defaults()): an adapter below any is below core. */
      const CORE_MAXIMA = {
        maxTextureDimension1D: 8192,
        maxTextureDimension2D: 8192,
        maxTextureDimension3D: 2048,
        maxTextureArrayLayers: 256,
        maxBindGroups: 4,
        maxBindingsPerBindGroup: 1000,
        maxDynamicUniformBuffersPerPipelineLayout: 8,
        maxDynamicStorageBuffersPerPipelineLayout: 4,
        maxSampledTexturesPerShaderStage: 16,
        maxSamplersPerShaderStage: 16,
        maxStorageBuffersPerShaderStage: 8,
        maxStorageTexturesPerShaderStage: 4,
        maxUniformBuffersPerShaderStage: 12,
        maxUniformBufferBindingSize: 65536,
        maxStorageBufferBindingSize: 134217728,
        maxVertexBuffers: 8,
        maxBufferSize: 268435456,
        maxVertexAttributes: 16,
        maxVertexBufferArrayStride: 2048,
        maxColorAttachments: 8,
        maxComputeWorkgroupStorageSize: 16384,
        maxComputeInvocationsPerWorkgroup: 256,
        maxComputeWorkgroupSizeX: 256,
        maxComputeWorkgroupSizeY: 256,
        maxComputeWorkgroupSizeZ: 64,
        maxComputeWorkgroupsPerDimension: 65535,
      };
      /** Alignments, which an adapter may only lower. */
      const CORE_ALIGNMENTS = { minUniformBufferOffsetAlignment: 256, minStorageBufferOffsetAlignment: 256 };
      const GPU_UNSUPPORTED = "gpu-unsupported";
      const BOOT_FAILED = "boot-failed";
      const Reason = {
        NoWebGpu: "no-webgpu",
        NoAdapter: "no-adapter",
        LimitBelowCore: "limit-below-core",
      };
      const State = { Starting: "starting", Running: "running", Unsupported: "unsupported", Failed: "failed" };
      /** Why a flush of the saves mirror failed (genex-core's MirrorError wire codes). */
      const SaveError = { Quota: "save-quota", Unavailable: "save-unavailable" };
      /** One live frame feeds the simulation at most this long (the runtime caps it too). */
      const MAX_FRAME_MS = 250;
      /** The display refresh rates the shell recognises in its frame intervals, in Hz. */
      const DISPLAY_RATES_HZ = [30, 48, 50, 60, 72, 75, 90, 100, 120, 144, 165, 180, 240];
      /** A measured refresh within this share of a listed rate's interval is that rate (the nearest one). */
      const DISPLAY_RATE_TOLERANCE = 0.08;
      /** The rate in use is kept while the measured refresh stays within this share of it. */
      const DISPLAY_RATE_KEEP = 0.15;
      /** The refresh is the median of this many recent frame intervals. */
      const REFRESH_SAMPLES = 31;
      /** Only intervals shorter than this are refresh samples (a stall is not a refresh). */
      const REFRESH_SAMPLE_MAX_MS = 100;
      /** How fast the frames' phase against the refreshes is followed (a share per frame). */
      const PHASE_FOLLOW = 1 / 32;
      /** Why a frame stopped the game: the module's typed code on its error, else frame-failed. Wire values. */
      const FrameFailure = { DeviceLost: "device-lost", Failed: "frame-failed" };
      /** A crash record's format and the kinds, sources and classes the shell writes (src/shared/crash-record.ts). Wire values. */
      const CRASH_FORMAT = "genex-crash/1";
      const CrashKind = { Panic: "panic", GpuValidation: "gpu-validation", DeviceLost: "device-lost", WasmTrap: "wasm-trap" };
      const CrashSource = { Game: "game", Shell: "shell" };
      const WasmTrapKind = { Unreachable: "unreachable", Memory: "memory", Stack: "stack", Other: "other" };
      const GpuErrorClass = { Validation: "validation", OutOfMemory: "out-of-memory", Internal: "internal" };
      /**
       * What a trap was, from the engine's RuntimeError text: WebAssembly gives a trap no typed code,
       * so the texts V8, SpiderMonkey and JavaScriptCore use are the only signal (lower case).
       */
      const TRAP_TEXTS = [
        [WasmTrapKind.Unreachable, ["unreachable"]],
        [WasmTrapKind.Memory, ["memory access out of bounds", "index out of bounds", "out of bounds memory access"]],
        [WasmTrapKind.Stack, ["call stack", "too much recursion"]],
      ];
      /** One engine stack frame inside the module (`wasm-function[N]:0xOFF`). */
      const WASM_FRAME = /wasm-function\[(\d+)\]:0x([0-9a-f]+)/gi;
      /** The destination a web record names. */
      const WEB_DESTINATION = "web";
      /** The lost reason of a device the page destroyed on purpose: not a crash. */
      const LOST_DESTROYED = "destroyed";
      /** The IndexedDB object store crash records are kept in (keys count up), and how many stay. */
      const CRASHES_STORE = "records";
      const CRASHES_DB_VERSION = 1;
      const CRASH_RECORDS_KEPT = 16;
      /** The record caps the shell keeps to (genex-crash's): its JSON, its message and its frames. */
      const CRASH_RECORD_MAX_BYTES = 64 * 1024;
      const CRASH_MESSAGE_MAX_CHARS = 2048;
      const CRASH_FRAMES_MAX = 128;
      /** Distinct uncaptured GPU errors one page records (a browser may report one every frame). */
      const GPU_ERROR_RECORDS_MAX = 4;
      /** The mouse button a page pointer is (the protocol's key name). */
      const MOUSE1 = "Mouse1";
      /** One wheel line in pixels (WheelEvent.DOM_DELTA_LINE), as the desktop shell counts a notch. */
      const WHEEL_LINE_PX = 100;
      /** The IndexedDB object stores a game's saves are kept in, keyed by save name: each file's bytes and its byte length. */
      const SavesStore = { Files: "files", Sizes: "sizes" };
      /** The saves database's version: 2 added the sizes store (a version-1 database gains it on open). */
      const SAVES_DB_VERSION = 2;
      /** The suffix of a saved file a lazy module keeps by name and size only (genex-core's mirror::LAZY_SUFFIX): a slot body. */
      const LAZY_SAVE_SUFFIX = ".sav";
      /** An idle flush waits at most this long for the browser to be idle. */
      const SAVE_IDLE_TIMEOUT_MS = 2000;
      /** After a refused flush, the next idle one waits this long (a hidden or left page flushes at once). */
      const SAVE_RETRY_MS = 5000;
      /** The build's asset map, and the folder the files it names are fetched from. */
      const ASSET_MAP = "assets.json";
      const ASSETS_DIR = "assets/";
      /** How many asset files are fetched at once (before the first frame, and again while playing). */
      const ASSET_FETCHES = 6;
      /** The most files one `reloadAssets` names (native-contract NATIVE_RELOAD_FILES_MAX), and one file's cap (the plan's per-file cap). */
      const RELOAD_FILES_MAX = 256;
      const RELOAD_FILE_MAX_BYTES = 256 * 1024 * 1024;
      /** Why the page refused a changed file before the op (the op's `refused[].code`), by the module's refusal code. */
      const RELOAD_REFUSALS = {
        "asset-unsafe-path": "unsafe-path",
        "asset-outside": "unsafe-path",
        "asset-digest-mismatch": "digest-mismatch",
      };
      /**
       * The most one fetch made while playing carries (rust-build-web.ts WEB_STREAM_LIMITS.fetchBytes):
       * a bigger piece is refused unfetched, which bounds the module's memory at its pool plus one asset.
       */
      const STREAM_FETCH_MAX_BYTES = 64 * 1024 * 1024;
      /**
       * Fetched pieces handed to the module per frame, in bytes (always at least one piece): the rest
       * wait in the page, since the module's memory never shrinks once grown.
       */
      const STREAM_HANDOFF_BYTES = 8 * 1024 * 1024;
      /** The WebGPU features of the compressed texture families, in the order the plan is told them. */
      const TEXTURE_FEATURES = ["texture-compression-bc", "texture-compression-astc", "texture-compression-etc2"];
      /** A screen whose short side is at most this many CSS pixels is a phone's (genex-render's WEB_MOBILE_SHORT_SIDE_CSS_PX). */
      const MOBILE_SHORT_SIDE_CSS_PX = 900;
      /** Why an asset stopped the boot (the module's own refusals keep their codes). Wire values. */
      const AssetFailure = {
        FetchFailed: "asset-fetch-failed",
        TooLarge: "asset-too-large",
        Outside: "asset-outside",
      };

      /**
       * Where the boot is (src/shared/native-contract.ts BootStage, the same words a native game's
       * `starting` events carry), in the order a boot passes them. Wire values.
       */
      const LoadStage = {
        Wasm: "wasm",
        Assets: "assets",
        Device: "device",
        Pipelines: "pipelines",
        Frame: "frame",
        Ready: "ready",
      };
      const BOOT_TIMEOUT = "boot-timeout";
      /** The game's module, which the shell fetches itself to count its bytes. */
      const WASM_FILE = "game_bg.wasm";
      /** A boot whose progress stops this long ends with boot-timeout (`GenexShellConfig.stallMs` sets it, for tests). */
      const BOOT_STALL_MS = 120000;
      /** The dry boot may take this long to list the pipelines; past it the boot goes on without them. */
      const RECORD_TIMEOUT_MS = 30000;
      /**
       * Pipelines asked for at once while pre-warming: enough to keep the browser's compile threads
       * busy, few enough that their set-up on its GPU thread never holds a frame for long (all 62
       * of Lakeside's at once held one for half a second; 12 at a time hold none past 0.1 s).
       */
      const PREWARM_COMPILES = 12;
      /** The loading screen's fade before it leaves. */
      const LOADER_FADE_MS = 280;
      /** The share of the bar each stage fills, [from, to] (wasm is most of a first load's wait). */
      const STAGE_SPAN = {
        wasm: [0, 0.3],
        assets: [0.3, 0.45],
        device: [0.45, 0.5],
        pipelines: [0.5, 0.95],
        frame: [0.95, 1],
        ready: [1, 1],
      };

      const canvas = document.getElementById("game");
      const notice = document.getElementById("save-notice");
      const loader = document.getElementById("loading");
      /** The loading state: its stall watch, the bar's fill so far, and what the boot staged for the dry boot. */
      const loading = { watchdog: null, fill: 0, staged: { saves: [], savesIndex: [], map: null, assets: [] } };
      const status = { state: State.Starting, code: null, reason: null, limit: null, receipt: null };
      /**
       * The saves store: its database, the flush and lazy-body reads in progress (each runs after the
       * last), whether an idle flush is scheduled and when a refused one may retry, and whether the
       * module wrote its suspend autosave for the page's current hide.
       */
      const saves = {
        db: null,
        flushing: Promise.resolve(),
        reading: Promise.resolve(),
        scheduled: false,
        retryAt: 0,
        suspended: false,
      };
      /** The crash records: the database, those taken before it opened, and whether the module is dead. */
      const crashes = {
        db: null,
        taken: [],
        writing: Promise.resolve(),
        fatal: false,
        panicked: false,
        deviceLost: false,
        gpuErrors: new Set(),
      };
      /**
       * The fetches made while playing: pieces the module wants and not yet asked for, how many are
       * open, and the fetched ones waiting for the next frame (with the most bytes ever waiting).
       */
      const streaming = { queued: [], open: 0, held: [], heldBytes: 0, heldMost: 0, fetched: 0, refused: 0 };
      const shell = {
        status,
        module: null,
        world: null,
        progress: null,
        adapter: null,
        streaming,
        flushSaves: async () => {},
        crash: takeGameCrash,
      };
      window.GenexShell = shell;

      function firstLimitBelowCore(limits) {
        for (const [name, least] of Object.entries(CORE_MAXIMA)) {
          if (!(Number(limits?.[name]) >= least)) return name;
        }
        for (const [name, most] of Object.entries(CORE_ALIGNMENTS)) {
          if (!(Number(limits?.[name]) <= most)) return name;
        }
        return null;
      }

      /** The refusal before anything is fetched, or null when the browser looks like WebGPU core. */
      async function preflight() {
        if (!("gpu" in navigator) || !navigator.gpu) return { reason: Reason.NoWebGpu };
        let adapter = null;
        try {
          adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" });
        } catch {
          adapter = null;
        }
        if (!adapter) return { reason: Reason.NoAdapter };
        const limit = firstLimitBelowCore(adapter.limits);
        if (limit) return { reason: Reason.LimitBelowCore, limit };
        shell.adapter = adapterFacts(adapter);
        return null;
      }

      /**
       * What the asset plan reads of the adapter: the compressed texture families it samples (their
       * WebGPU feature names) and whether the page is a phone's, by the renderer's rule, so the
       * file planned is the family the renderer stores.
       */
      function adapterFacts(adapter) {
        const offered = adapter.features;
        const features = TEXTURE_FEATURES.filter((name) => typeof offered?.has === "function" && offered.has(name));
        return { features, mobile: isMobile(pageHints()) };
      }

      /**
       * Whether the hints say phone or tablet (genex-render's WebHints::is_mobile): a mobile user
       * agent, touch with a coarse pointer, or a short screen side of at most MOBILE_SHORT_SIDE_CSS_PX.
       */
      function isMobile(hints) {
        const coarseTouch = hints.maxTouchPoints > 0 && hints.coarsePointer;
        const smallScreen = hints.shortSideCssPx > 0 && hints.shortSideCssPx <= MOBILE_SHORT_SIDE_CSS_PX;
        return hints.uaMobile === true || coarseTouch || smallScreen;
      }

      /** One element with its text (never markup) and attributes. */
      function element(tag, text, attributes = {}) {
        const made = document.createElement(tag);
        if (text) made.textContent = text;
        for (const [name, value] of Object.entries(attributes)) made.setAttribute(name, value);
        return made;
      }

      /** The card's footer: the status's typed code and its reason. */
      function codeFooter(label) {
        const detail = [status.reason, status.limit].filter(Boolean).join(": ");
        const footer = element("footer");
        footer.append(
          `${label} `,
          element("code", status.code, { "data-genex-code": "" }),
          element("span", detail ? ` (${detail})` : "", { "data-genex-reason": "" }),
        );
        return footer;
      }

      /** Shows the card page in place of the canvas, marked with which card it is. */
      function showCard(kind, children) {
        stopLoading();
        canvas.hidden = true;
        document.body.classList.add("unsupported");
        const card = document.querySelector("#unsupported .card");
        card.setAttribute("data-genex-card", kind);
        card.replaceChildren(...children);
        document.getElementById("unsupported").hidden = false;
      }

      /** The unsupported page's card, its words from MESSAGE and the refusal's code and reason. */
      function renderUnsupportedCard() {
        const words = MESSAGE.unsupported;
        const supported = element("ul");
        supported.append(...words.supported.map((line) => element("li", line)));
        const footer = codeFooter(words.codeLabel);
        showCard(State.Unsupported, [
          element("h1", words.title, { id: "unsupported-title" }),
          element("p", words.body),
          element("h2", words.supportedHeading),
          supported,
          element("h2", words.excludedHeading),
          element("p", words.excluded, { class: "excluded" }),
          footer,
        ]);
      }

      /** The page contract of a game that never started: state() answers the typed refusal, nothing else is bound. */
      function reportUnsupported() {
        const refusal = { reason: status.reason, limit: status.limit };
        window.__studio = {
          version: 1,
          state: () => ({ version: 1, error: status.code, volatile: { gpu: { ...refusal } } }),
          crashes: readCrashes,
        };
        console.error(`genex: ${status.code} (${[status.reason, status.limit].filter(Boolean).join(": ")})`);
      }

      function showUnsupported(refusal) {
        Object.assign(status, {
          state: State.Unsupported,
          code: refusal.code ?? GPU_UNSUPPORTED,
          reason: refusal.reason ?? null,
          limit: refusal.limit ?? null,
        });
        renderUnsupportedCard();
        reportUnsupported();
      }

      /**
       * A boot that threw: the "couldn't start" card with the typed code, never an empty stage. The
       * page contract answers the code from state() unless the game's verbs were bound already.
       */
      function showFailed(error) {
        Object.assign(status, { state: State.Failed, code: BOOT_FAILED, reason: String(error?.message ?? error) });
        const words = MESSAGE.failed;
        showCard(State.Failed, [
          element("h1", words.title, { id: "unsupported-title" }),
          element("p", words.body),
          codeFooter(words.codeLabel),
        ]);
        window.__studio ??= {
          version: 1,
          state: () => ({ version: 1, error: status.code, volatile: { boot: { reason: status.reason } } }),
          crashes: readCrashes,
        };
        console.error(error);
      }

      /**
       * A frame the module refused with `device-lost` (the browser reset its GPU): the saves are
       * flushed first, then the card with the typed code, and the page contract answers the code.
       */
      async function showDeviceLost(game, error) {
        Object.assign(status, { state: State.Failed, code: FrameFailure.DeviceLost, reason: String(error?.message ?? error) });
        await flushSaves(game);
        const words = MESSAGE.deviceLost;
        showCard(State.Failed, [
          element("h1", words.title, { id: "unsupported-title" }),
          element("p", words.body),
          codeFooter(words.codeLabel),
        ]);
        console.error(error);
      }

      // ── loading: the screen from the first paint to the first lit frame, and its progress ──

      /** The stall watch's length: the page's `GenexShellConfig.stallMs` (tests), else BOOT_STALL_MS. */
      function stallMs() {
        const set = Number(window.GenexShellConfig?.stallMs);
        return set > 0 ? set : BOOT_STALL_MS;
      }

      /** Whether the boot is still on its way (no card took the page). */
      const booting = () => status.state === State.Starting || status.state === State.Running;

      /** The stage in words, with its count when it has one. */
      function stageWords(stage, done, total) {
        const words = MESSAGE.loading;
        if (total === null || done === null || stage === LoadStage.Ready) return words[stage];
        const count = stage === LoadStage.Wasm ? words.megabytes(done, total) : words.count(done, total);
        return `${words[stage]} · ${count}`;
      }

      /**
       * One step of the boot: the event and GenexShell.progress, the words and the bar (it only
       * fills), and the stall watch started again. Nothing once a card took the page.
       */
      function progress(stage, done = null, total = null) {
        if (!booting()) return;
        const detail = { stage, done, total };
        shell.progress = detail;
        window.dispatchEvent(new CustomEvent("genex:progress", { detail }));
        const [from, to] = STAGE_SPAN[stage];
        const share = total > 0 && done !== null ? Math.min(1, done / total) : 0;
        loading.fill = Math.max(loading.fill, from + (to - from) * share);
        loader.querySelector("[data-genex-bar]").style.transform = `scaleX(${loading.fill})`;
        document.getElementById("loading-stage").textContent = stageWords(stage, done, total);
        clearTimeout(loading.watchdog);
        loading.watchdog = stage === LoadStage.Ready ? null : setTimeout(() => showTimeout(detail), stallMs());
      }

      /** The loading screen gone at once (a card takes the page) and its stall watch stopped. */
      function stopLoading() {
        clearTimeout(loading.watchdog);
        loader.hidden = true;
        loader.setAttribute("aria-busy", "false");
      }

      /** The first lit frame is on screen: the loading screen fades out and leaves. */
      function finishLoading() {
        progress(LoadStage.Ready);
        loader.setAttribute("aria-busy", "false");
        loader.classList.add("leaving");
        setTimeout(() => {
          loader.hidden = true;
        }, LOADER_FADE_MS);
        gpuHooks.held = [];
      }

      /** A boot that stopped progressing: the "taking too long" card with boot-timeout and the stage it stopped at. */
      function showTimeout({ stage, done, total }) {
        if (!booting() || status.state === State.Running) return;
        const count = done !== null && total !== null ? `: ${done} of ${total}` : "";
        Object.assign(status, { state: State.Failed, code: BOOT_TIMEOUT, reason: `${stage}${count}` });
        const words = MESSAGE.timeout;
        showCard(State.Failed, [
          element("h1", words.title, { id: "unsupported-title" }),
          element("p", words.body),
          codeFooter(words.codeLabel),
        ]);
        window.__studio ??= {
          version: 1,
          state: () => ({ version: 1, error: status.code, volatile: { boot: { reason: status.reason } } }),
          crashes: readCrashes,
        };
        console.error(`genex: ${BOOT_TIMEOUT} (${status.reason})`);
      }

      /**
       * The game's module, fetched here so its bytes are counted, then compiled once (the dry boot
       * instantiates the same compiled module). Null when the file did not answer: the module's
       * own init then fetches it, and fails as it always did.
       */
      async function fetchWasm() {
        const response = await fetch(WASM_FILE).catch(() => null);
        if (!response?.ok || !response.body) {
          progress(LoadStage.Wasm);
          return null;
        }
        const announced = Number(response.headers.get("content-length")) || null;
        const reader = response.body.getReader();
        const chunks = [];
        let received = 0;
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          received += value.length;
          // A compressed response announces fewer bytes than it delivers: then the total is unknown.
          progress(LoadStage.Wasm, received, announced !== null && received <= announced ? announced : null);
        }
        const bytes = new Uint8Array(received);
        let at = 0;
        for (const chunk of chunks) {
          bytes.set(chunk, at);
          at += chunk.length;
        }
        progress(LoadStage.Wasm, received, received);
        return WebAssembly.compile(bytes);
      }

      // ── pipelines: the dry boot that lists them, and their asynchronous compiles ──

      /** The page's real device (the game's), the dry boot's list, and what keeps its compiles alive until the first frame. */
      const gpuHooks = { device: null, plan: null, created: 0, held: [] };

      /** The dry boot's references (`{$ref: index}`) as the objects made from them. */
      function revive(made, value) {
        if (Array.isArray(value)) return value.map((entry) => revive(made, entry));
        if (value && typeof value === "object") {
          if ("$ref" in value) return made[value.$ref];
          return Object.fromEntries(Object.entries(value).map(([key, entry]) => [key, revive(made, entry)]));
        }
        return value;
      }

      /**
       * Before the game's boot gets its device: every module and layout the dry boot listed, then
       * each pipeline asked for with create*PipelineAsync and counted as it compiles. All are kept
       * until the first frame, so the boot's synchronous calls find them compiled. The browser
       * parses a shader module on the thread that also composites the page, so the modules go one
       * at a time, each awaited (an error scope's answer comes back once it is parsed): a burst of
       * them held every frame for most of a second.
       */
      async function prewarm(device, plan) {
        const create = { module: "createShaderModule", bgl: "createBindGroupLayout", layout: "createPipelineLayout" };
        const made = [];
        gpuHooks.held = made;
        for (const object of plan.objects) {
          const parsed = object.kind === "module";
          if (parsed) device.pushErrorScope("validation");
          made.push(device[create[object.kind]](revive(made, object.desc)));
          if (parsed) await device.popErrorScope().catch(() => null);
        }
        const total = plan.pipelines.length;
        const queued = [...plan.pipelines];
        let done = 0;
        progress(LoadStage.Pipelines, done, total);
        const compileNext = async () => {
          for (let pipeline = queued.shift(); pipeline; pipeline = queued.shift()) {
            const call = pipeline.kind === "render" ? "createRenderPipelineAsync" : "createComputePipelineAsync";
            try {
              gpuHooks.held.push(await device[call](revive(made, pipeline.desc)));
            } catch {
              // A pipeline this device refuses is refused again where the boot asks for it.
            }
            done += 1;
            progress(LoadStage.Pipelines, done, total);
          }
        };
        await Promise.all(Array.from({ length: PREWARM_COMPILES }, compileNext));
      }

      /**
       * The page's WebGPU, watched: the first device opened is the game's (pre-warmed from the dry
       * boot's list before the game gets it), and without a list each synchronous pipeline it
       * creates is counted instead.
       */
      function watchPageGpu() {
        const adapter = globalThis.GPUAdapter?.prototype;
        const device = globalThis.GPUDevice?.prototype;
        if (!adapter || !device) return;
        const requestDevice = adapter.requestDevice;
        adapter.requestDevice = async function (...args) {
          const opened = await requestDevice.apply(this, args);
          if (gpuHooks.device === null) {
            gpuHooks.device = opened;
            watchDeviceCrashes(opened);
            if (gpuHooks.plan) await prewarm(opened, gpuHooks.plan).catch((error) => console.warn(error));
          }
          return opened;
        };
        for (const name of ["createRenderPipeline", "createComputePipeline"]) {
          const original = device[name];
          device[name] = function (...args) {
            if (this === gpuHooks.device && gpuHooks.plan === null && loader.hidden === false) {
              gpuHooks.created += 1;
              progress(LoadStage.Pipelines, gpuHooks.created, null);
            }
            return original.apply(this, args);
          };
        }
      }

      /**
       * The dry boot, run in a worker (stringified): it boots the game's module once with WebGPU's
       * pipeline calls recorded, never compiled. Shader modules are stand-ins, each pipeline is
       * written down (its modules and layouts as references) and answered with a placeholder,
       * textures are 1x1, nothing is uploaded or submitted, and the device's errors (a placeholder
       * fits nothing) and the console are silenced. Posts {plan} or {error}.
       */
      function dryBoot() {
        const quiet = () => {};
        for (const name of ["log", "info", "warn", "error", "debug"]) console[name] = quiet;
        const plan = { objects: [], pipelines: [] };
        const ids = new WeakMap();
        const refOf = (value) => {
          if (value && typeof value === "object" && ids.has(value)) return { $ref: ids.get(value) };
          if (Array.isArray(value)) return value.map(refOf);
          if (value && typeof value === "object") {
            const out = {};
            for (const key in value) out[key] = refOf(value[key]);
            return out;
          }
          return value;
        };
        const remember = (made, kind, desc) => {
          ids.set(made, plan.objects.length);
          plan.objects.push({ kind, desc: refOf(desc) });
          return made;
        };
        const device = GPUDevice.prototype;
        const real = {
          module: device.createShaderModule,
          render: device.createRenderPipeline,
          compute: device.createComputePipeline,
          bgl: device.createBindGroupLayout,
          layout: device.createPipelineLayout,
          texture: device.createTexture,
        };
        const placeholders = new WeakMap();
        const placeholder = (gpu, kind) => {
          if (!placeholders.has(gpu)) {
            const vertex = real.module.call(gpu, { code: "@vertex fn main() -> @builtin(position) vec4f { return vec4f(0.0); }" });
            const compute = real.module.call(gpu, { code: "@compute @workgroup_size(1) fn main() {}" });
            placeholders.set(gpu, {
              render: real.render.call(gpu, { layout: "auto", vertex: { module: vertex, entryPoint: "main" } }),
              compute: real.compute.call(gpu, { layout: "auto", compute: { module: compute, entryPoint: "main" } }),
            });
          }
          return placeholders.get(gpu)[kind];
        };
        const recordPipeline = (kind) =>
          function (desc) {
            plan.pipelines.push({ kind, desc: refOf(desc) });
            return placeholder(this, kind);
          };
        device.createShaderModule = (desc) =>
          remember({ label: desc?.label ?? "", getCompilationInfo: async () => ({ messages: [] }) }, "module", desc);
        device.createBindGroupLayout = function (desc) {
          return remember(real.bgl.call(this, desc), "bgl", desc);
        };
        device.createPipelineLayout = function (desc) {
          return remember(real.layout.call(this, desc), "layout", desc);
        };
        device.createRenderPipeline = recordPipeline("render");
        device.createComputePipeline = recordPipeline("compute");
        device.createRenderPipelineAsync = async function (desc) {
          return device.createRenderPipeline.call(this, desc);
        };
        device.createComputePipelineAsync = async function (desc) {
          return device.createComputePipeline.call(this, desc);
        };
        device.createTexture = function (desc) {
          return real.texture.call(this, { ...desc, size: [1, 1, 1], mipLevelCount: 1 });
        };
        for (const name of ["writeBuffer", "writeTexture", "copyExternalImageToTexture", "submit"]) {
          GPUQueue.prototype[name] = quiet;
        }
        Object.defineProperty(device, "onuncapturederror", { configurable: true, get: () => null, set: quiet });
        const requestDevice = GPUAdapter.prototype.requestDevice;
        GPUAdapter.prototype.requestDevice = async function (...args) {
          const opened = await requestDevice.apply(this, args);
          opened.addEventListener("uncapturederror", (event) => event.preventDefault());
          return opened;
        };
        self.onmessage = async ({ data }) => {
          try {
            const source = URL.createObjectURL(new Blob([data.source], { type: "text/javascript" }));
            const game = await import(source);
            await game.default({ module_or_path: data.module });
            if (typeof game.studio_saves_preload === "function") game.studio_saves_preload(data.saves);
            if (typeof game.studio_saves_index === "function") game.studio_saves_index(data.savesIndex);
            if (data.map !== null && typeof game.studio_assets_plan === "function") {
              game.studio_assets_plan(data.map, data.adapter);
              for (const [name, bytes] of data.assets) game.studio_assets_preload(name, bytes);
            }
            const board = typeof OffscreenCanvas === "function" ? new OffscreenCanvas(data.size[0], data.size[1]) : null;
            await game.studio_boot(board, data.hints);
            self.postMessage({ plan });
          } catch (error) {
            self.postMessage({ error: String(error?.message ?? error) });
          }
        };
      }

      /**
       * The pipelines the game's boot creates, listed by the dry boot in a worker; null when this
       * browser cannot run it (no module worker, no WebGPU there, no compiled module) or it failed
       * or took past RECORD_TIMEOUT_MS. The staged assets move to the worker.
       */
      async function listPipelines(module) {
        if (!module || typeof Worker !== "function" || !globalThis.GPUDevice) return null;
        const source = await fetch("./game.js").then((response) => (response.ok ? response.text() : null));
        if (source === null) return null;
        const code = `(${dryBoot.toString()})();`;
        const url = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
        const worker = new Worker(url, { type: "module" });
        const { saves, savesIndex, map, assets } = loading.staged;
        const answer = new Promise((resolve) => {
          worker.onmessage = ({ data }) => resolve(data);
          worker.onerror = (event) => resolve({ error: String(event.message ?? "worker error") });
          setTimeout(() => resolve({ error: "the dry boot took too long" }), RECORD_TIMEOUT_MS);
        });
        const transfer = assets.map(([, bytes]) => bytes.buffer);
        const size = [canvas.width, canvas.height];
        const hints = deviceHints();
        const message = { source, module, saves, savesIndex, map, assets, adapter: adapterJson(), hints, size };
        worker.postMessage(message, [...new Set(transfer)]);
        loading.staged = { saves: [], savesIndex: [], map: null, assets: [] };
        const result = await answer;
        worker.terminate();
        URL.revokeObjectURL(url);
        if (result.error) console.warn(`genex: pipelines compile as the boot asks (${result.error})`);
        return result.plan?.pipelines.length ? result.plan : null;
      }

      /** After the first frame the game drew: its GPU work done, then one display frame, then the loading screen leaves. */
      async function awaitFirstLitFrame() {
        await gpuHooks.device?.queue.onSubmittedWorkDone().catch(() => {});
        await new Promise((shown) => requestAnimationFrame(shown));
        finishLoading();
      }

      /** The device hints studio_boot classifies the browser by, as JSON (a member the browser hides is left out). */
      function deviceHints() {
        return JSON.stringify(pageHints());
      }

      /** The page's device hints as an object ({@link deviceHints}). */
      function pageHints() {
        const screen = window.screen ?? { width: 0, height: 0 };
        const hints = {
          maxTouchPoints: navigator.maxTouchPoints ?? 0,
          coarsePointer: window.matchMedia?.("(pointer: coarse)").matches ?? false,
          shortSideCssPx: Math.round(Math.min(screen.width, screen.height)),
        };
        if (typeof navigator.deviceMemory === "number") hints.deviceMemoryGb = navigator.deviceMemory;
        if (typeof navigator.hardwareConcurrency === "number") hints.hardwareConcurrency = navigator.hardwareConcurrency;
        if (typeof navigator.userAgentData?.mobile === "boolean") hints.uaMobile = navigator.userAgentData.mobile;
        return hints;
      }

      /**
       * The canvas's drawing buffer at its displayed size in device pixels (left alone when already
       * there): the `device` box the observer reported when it covers the CSS size (within one CSS
       * pixel a side), else the CSS size times the ratio. A CSS side is often fractional, and its
       * rounded product a device pixel off, which the compositor would resample every frame.
       */
      function fitCanvas(device) {
        const ratio = window.devicePixelRatio || 1;
        const css = [canvas.clientWidth * ratio, canvas.clientHeight * ratio];
        const covers = device && Math.abs(device.width - css[0]) <= ratio && Math.abs(device.height - css[1]) <= ratio;
        const width = Math.max(1, covers ? device.width : Math.round(css[0]));
        const height = Math.max(1, covers ? device.height : Math.round(css[1]));
        if (canvas.width !== width) canvas.width = width;
        if (canvas.height !== height) canvas.height = height;
      }

      /** The device-pixel box a ResizeObserver entry reports, or undefined where the browser has none. */
      function devicePixels(entry) {
        const box = entry?.devicePixelContentBoxSize?.[0];
        return box ? { width: box.inlineSize, height: box.blockSize } : undefined;
      }

      /**
       * Keep the canvas at its displayed size from the moment it is shown. The studio's Live view
       * can get its size while studio_boot still runs (it keeps a loading page at no size), so a
       * listener added after the boot missed it and the game drew into a 1×1 canvas: black. Where
       * the observer reports the device-pixel box it alone follows the canvas (a move to another
       * screen changes that box too); elsewhere the window's resizes do as well.
       */
      function followCanvasSize() {
        fitCanvas();
        if (typeof ResizeObserver !== "function") {
          window.addEventListener("resize", () => fitCanvas());
          return;
        }
        const observer = new ResizeObserver((entries) => fitCanvas(devicePixels(entries.at(-1))));
        try {
          observer.observe(canvas, { box: "device-pixel-content-box" });
        } catch {
          observer.observe(canvas);
          window.addEventListener("resize", () => fitCanvas());
        }
      }

      function hex(bytes) {
        return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
      }

      // ── saves: the IndexedDB side of the module's in-memory mirror ──

      /** An IndexedDB request as a promise. */
      function settled(request) {
        return new Promise((resolve, reject) => {
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      /** The game's saves database at version 2, or null when this browser keeps none. */
      async function openSavesDb(name) {
        if (!("indexedDB" in window) || !window.indexedDB) return null;
        const request = indexedDB.open(name, SAVES_DB_VERSION);
        request.onupgradeneeded = () => upgradeSavesDb(request.result, request.transaction);
        return settled(request);
      }

      /**
       * The upgrade, in its one versionchange transaction: a new database gets both stores, and a
       * version-1 one (files only) gains the sizes store filled from every file it holds, so none is
       * lost and a failed upgrade leaves version 1 as it was.
       */
      function upgradeSavesDb(db, transaction) {
        if (!db.objectStoreNames.contains(SavesStore.Files)) db.createObjectStore(SavesStore.Files);
        if (db.objectStoreNames.contains(SavesStore.Sizes)) return;
        const sizes = db.createObjectStore(SavesStore.Sizes);
        const cursor = transaction.objectStore(SavesStore.Files).openCursor();
        cursor.onsuccess = () => {
          const at = cursor.result;
          if (!at) return;
          sizes.put(at.value?.byteLength ?? 0, at.key);
          at.continue();
        };
      }

      /** Every saved file whole, [[name, Uint8Array], …], for a module that keeps no file lazily. */
      async function readAllSaves(db) {
        const store = db.transaction(SavesStore.Files, "readonly").objectStore(SavesStore.Files);
        const [names, values] = await Promise.all([settled(store.getAllKeys()), settled(store.getAll())]);
        return { entries: names.map((name, i) => [String(name), new Uint8Array(values[i])]), index: [] };
      }

      /**
       * For a module that keeps slot bodies lazily: every file but the .sav ones whole, and the .sav
       * ones by name and size only ([[name, size], …]), their bodies left in the store. A .sav file
       * with no size recorded is read whole (the module keeps it by its length).
       */
      async function readSavesIndex(db) {
        const transaction = db.transaction([SavesStore.Files, SavesStore.Sizes], "readonly");
        const files = transaction.objectStore(SavesStore.Files);
        const sizes = transaction.objectStore(SavesStore.Sizes);
        const [names, sized, lengths] = await Promise.all([
          settled(files.getAllKeys()),
          settled(sizes.getAllKeys()),
          settled(sizes.getAll()),
        ]);
        const sizeOf = new Map(sized.map((name, i) => [String(name), lengths[i]]));
        const indexed = (name) => name.endsWith(LAZY_SAVE_SUFFIX) && Number.isSafeInteger(sizeOf.get(name));
        const index = names.map(String).filter(indexed).map((name) => [name, sizeOf.get(name)]);
        const whole = names.filter((name) => !indexed(String(name)));
        const bodies = await Promise.all(whole.map((name) => settled(files.get(name))));
        return { entries: whole.map((name, i) => [String(name), new Uint8Array(bodies[i])]), index };
      }

      /** The mirror filled before the first reset; without IndexedDB the game saves for this page only. */
      async function preloadSaves(game) {
        const lazy = typeof game.studio_saves_index === "function";
        try {
          saves.db = await openSavesDb(game.studio_saves_database());
          const read = lazy ? readSavesIndex : readAllSaves;
          const { entries, index } = saves.db ? await read(saves.db) : { entries: [], index: [] };
          // The dry boot's first reset reads the same files (it gets copies; the mirror keeps its own).
          loading.staged.saves = entries.map(([name, bytes]) => [name, bytes.slice()]);
          loading.staged.savesIndex = index;
          game.studio_saves_preload(entries);
          if (lazy) game.studio_saves_index(index);
          if (!saves.db) game.studio_saves_unavailable();
        } catch (error) {
          console.warn(`genex: saves: ${error?.name ?? error}`);
          saves.db = null;
          game.studio_saves_preload([]);
          game.studio_saves_unavailable();
        }
        showSaveNotice(game);
        reportPersistence(game).catch((error) => console.warn(`genex: saves: ${error?.name ?? error}`));
      }

      /** Whether the browser keeps the game's storage under pressure: asked once; refused, failed or unasked is false. */
      async function storagePersistence() {
        const storage = navigator.storage;
        if (!saves.db || typeof storage?.persist !== "function") return false;
        if (await storage.persisted?.().catch(() => false)) return true;
        return (await storage.persist().catch(() => false)) === true;
      }

      /** Ask for persistent storage, then tell a module that takes it whether the browser granted it. */
      async function reportPersistence(game) {
        const persistent = await storagePersistence();
        if (typeof game.studio_saves_persistent === "function" && !crashes.fatal) game.studio_saves_persistent(persistent);
      }

      /** The typed code of a storage failure. */
      function saveErrorOf(error) {
        return error?.name === "QuotaExceededError" ? SaveError.Quota : SaveError.Unavailable;
      }

      /**
       * Write the files the mirror took (each one's bytes and size) and delete the files it removed
       * from both stores, in one transaction; resolves with null or the typed code.
       */
      async function writeSaves(entries, removed) {
        if (!saves.db) return SaveError.Unavailable;
        try {
          const transaction = saves.db.transaction([SavesStore.Files, SavesStore.Sizes], "readwrite");
          const done = new Promise((resolve) => {
            transaction.oncomplete = () => resolve(null);
            transaction.onerror = () => resolve(saveErrorOf(transaction.error));
            transaction.onabort = () => resolve(saveErrorOf(transaction.error));
          });
          const files = transaction.objectStore(SavesStore.Files);
          const sizes = transaction.objectStore(SavesStore.Sizes);
          for (const [name, bytes] of entries) {
            files.put(bytes, name);
            sizes.put(bytes.byteLength, name);
          }
          for (const name of removed) {
            files.delete(name);
            sizes.delete(name);
          }
          return await done;
        } catch (error) {
          return saveErrorOf(error);
        }
      }

      /** The page's notice of a save error (state().error carries the same code). */
      function showSaveNotice(game) {
        const code = JSON.parse(game.studio_saves_status()).error;
        notice.hidden = !code;
        notice.textContent = code ? MESSAGE.saves[code] : "";
        if (code) notice.dataset.genexCode = code;
        else delete notice.dataset.genexCode;
      }

      /** The files the module removed since the last take (none from a module that keeps no such list). */
      function takeRemovedSaves(game) {
        return typeof game.studio_saves_take_removed === "function" ? Array.from(game.studio_saves_take_removed()) : [];
      }

      /** One flush: take the mirror's dirty and removed files, write them, answer how it went. */
      async function flushOnce(game) {
        const entries = game.studio_saves_take();
        const removed = takeRemovedSaves(game);
        if (entries.length === 0 && removed.length === 0) return;
        const error = await writeSaves(entries, removed);
        game.studio_saves_flushed(
          error,
          entries.map(([name]) => name),
        );
        if (error) saves.retryAt = performance.now() + SAVE_RETRY_MS;
        showSaveNotice(game);
      }

      /** Flushes run one after another; this one starts when the last has answered. */
      function flushSaves(game) {
        saves.flushing = saves.flushing.then(() => flushOnce(game)).catch((error) => console.warn(error));
        return saves.flushing;
      }

      /** After a frame: a flush when the browser is next idle, if anything is pending and no retry is waiting. */
      function scheduleIdleFlush(game) {
        if (saves.scheduled || performance.now() < saves.retryAt || game.studio_saves_pending() === 0) return;
        saves.scheduled = true;
        const run = () => {
          saves.scheduled = false;
          flushSaves(game);
        };
        if (typeof window.requestIdleCallback === "function") {
          window.requestIdleCallback(run, { timeout: SAVE_IDLE_TIMEOUT_MS });
        } else {
          setTimeout(run, 0);
        }
      }

      /** The stored bodies of `names`, [[name, Uint8Array | undefined], …]: undefined for a file the store does not keep. */
      async function readSaveBodies(names) {
        const missing = () => names.map((name) => [name, undefined]);
        if (!saves.db) return missing();
        try {
          const files = saves.db.transaction(SavesStore.Files, "readonly").objectStore(SavesStore.Files);
          const bodies = await Promise.all(names.map((name) => settled(files.get(name))));
          return names.map((name, i) => [name, bodies[i] === undefined ? undefined : new Uint8Array(bodies[i])]);
        } catch (error) {
          console.warn(`genex: saves: ${error?.name ?? error}`);
          return missing();
        }
      }

      /** Hand the module the lazy bodies it asked for, once read (a dead module gets none). */
      async function provideSaves(game, names) {
        const bodies = await readSaveBodies(names);
        if (crashes.fatal) return;
        for (const [name, bytes] of bodies) game.studio_saves_provide(name, bytes);
      }

      /** After a frame: the lazy bodies a load asked for are read from the store, after any read before them. */
      function serveSaveRequests(game) {
        if (typeof game.studio_saves_requests !== "function") return;
        const names = Array.from(game.studio_saves_requests(), String);
        if (names.length === 0) return;
        saves.reading = saves.reading.then(() => provideSaves(game, names)).catch((error) => console.warn(error));
      }

      /**
       * The page is hidden or left: the module writes its suspend autosave (once per hide, so a hide
       * followed by pagehide writes one), then the flush writes it to the store.
       */
      function suspendSaves(game) {
        const writes = !saves.suspended && !crashes.fatal && typeof game.studio_suspend_save === "function";
        if (writes) {
          saves.suspended = true;
          try {
            game.studio_suspend_save();
          } catch (error) {
            console.warn(`genex: saves: suspend: ${error?.message ?? error}`);
          }
        }
        return flushSaves(game);
      }

      function listenForSaves(game) {
        shell.flushSaves = () => flushSaves(game);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "hidden") suspendSaves(game);
          else saves.suspended = false;
        });
        window.addEventListener("pagehide", () => suspendSaves(game));
        window.addEventListener("pageshow", () => {
          saves.suspended = false;
        });
      }

      // ── assets: the files the build staged, fetched before the first frame ──

      /** A response's body, refused once it passes `limit` bytes (read no further). */
      async function boundedBytes(response, name, limit) {
        const tooLarge = () => new Error(`${AssetFailure.TooLarge}: ${name} is over ${limit} bytes`);
        if (Number(response.headers.get("content-length")) > limit) throw tooLarge();
        if (!response.body) return new Uint8Array(0);
        const reader = response.body.getReader();
        const bytes = new Uint8Array(limit);
        let length = 0;
        for (;;) {
          const { done, value } = await reader.read();
          if (done) return bytes.subarray(0, length);
          if (length + value.length > limit) {
            await reader.cancel();
            throw tooLarge();
          }
          bytes.set(value, length);
          length += value.length;
        }
      }

      /** Whether `url` is inside assets/ on the page's origin (`base`). */
      function insideAssets(url, base) {
        return url.origin === base.origin && url.pathname.startsWith(base.pathname);
      }

      /** The URL of `name` inside assets/, refused when it would leave it. */
      function assetUrl(name, base) {
        const url = new URL(String(name).split("/").map(encodeURIComponent).join("/"), base);
        if (!insideAssets(url, base)) throw new Error(`${AssetFailure.Outside}: ${name}`);
        return url;
      }

      /** A response for `name`, refused when a redirect took it outside assets/ on the page's origin. */
      function landedInside(response, name, base) {
        if (response.url && !insideAssets(new URL(response.url), base)) {
          throw new Error(`${AssetFailure.Outside}: ${name} was redirected to ${new URL(response.url).origin}`);
        }
        return response;
      }

      /** One planned file: fetched from inside assets/ only, at most its planned size, then handed to the module. */
      async function fetchAsset(game, base, [name, size]) {
        const url = assetUrl(name, base);
        const response = landedInside(await fetch(url, { cache: "no-store" }), name, base);
        if (!response.ok) throw new Error(`${AssetFailure.FetchFailed}: ${name} answered ${response.status}`);
        const bytes = await boundedBytes(response, name, size);
        game.studio_assets_preload(name, bytes);
        // The module copied them; the dry boot gets these (moved to its worker, never copied again).
        loading.staged.assets.push([name, bytes]);
      }

      /** The adapter's texture facts as the plan reads them (`{features, mobile}` JSON), or undefined before preflight passed. */
      function adapterJson() {
        return shell.adapter ? JSON.stringify(shell.adapter) : undefined;
      }

      /** The staged assets in the module before studio_boot: the map planned, then each file fetched and admitted. */
      async function preloadAssets(game) {
        if (typeof game.studio_assets_plan !== "function") {
          progress(LoadStage.Assets, 0, 0);
          return;
        }
        const response = await fetch(ASSET_MAP, { cache: "no-store" });
        if (!response.ok) throw new Error(`${AssetFailure.FetchFailed}: ${ASSET_MAP} answered ${response.status}`);
        loading.staged.map = await response.text();
        // The adapter picks one of a texture's family files; the progress counts only what is planned.
        const planned = Array.from(game.studio_assets_plan(loading.staged.map, adapterJson()));
        const total = planned.length;
        let done = 0;
        progress(LoadStage.Assets, done, total);
        const base = new URL(ASSETS_DIR, location.href);
        const fetchNext = async () => {
          for (let next = planned.shift(); next; next = planned.shift()) {
            await fetchAsset(game, base, next);
            done += 1;
            progress(LoadStage.Assets, done, total);
          }
        };
        await Promise.all(Array.from({ length: ASSET_FETCHES }, fetchNext));
      }

      // ── streaming: the pieces the game wants while playing, fetched by Range ──

      /** The first `length` bytes of a body (the rest is never read). */
      async function bodyPrefix(response, name, length) {
        if (!response.body) throw new Error(`${AssetFailure.FetchFailed}: ${name} has no body`);
        const reader = response.body.getReader();
        const bytes = new Uint8Array(length);
        let got = 0;
        while (got < length) {
          const { done, value } = await reader.read();
          if (done) break;
          const take = Math.min(value.length, length - got);
          bytes.set(value.subarray(0, take), got);
          got += take;
        }
        await reader.cancel().catch(() => {});
        if (got < length) throw new Error(`${AssetFailure.FetchFailed}: ${name} ended after ${got} of ${length} bytes`);
        return bytes;
      }

      /**
       * One wanted piece, `size` bytes of `name` from `offset`: a Range request inside assets/ on the
       * page's origin, the 206 body exactly that long; a server that ignores Range answers the whole
       * file, which is read only up to the piece's end and sliced. Refused unfetched past
       * STREAM_FETCH_MAX_BYTES; refused when a redirect leaves assets/ or the page's origin.
       */
      async function fetchPiece([name, offset, size]) {
        const whole = Number.isSafeInteger(offset) && offset >= 0 && Number.isSafeInteger(size) && size > 0;
        if (!whole || size > STREAM_FETCH_MAX_BYTES) {
          throw new Error(`${AssetFailure.TooLarge}: ${name} wants ${size} bytes (at most ${STREAM_FETCH_MAX_BYTES})`);
        }
        const base = new URL(ASSETS_DIR, location.href);
        const range = `bytes=${offset}-${offset + size - 1}`;
        const answered = await fetch(assetUrl(name, base), { cache: "no-store", headers: { Range: range } });
        const response = landedInside(answered, name, base);
        if (response.status === 206) {
          const at = /^bytes (\d+)-/.exec(response.headers.get("content-range") ?? "");
          if (at && Number(at[1]) !== offset) throw new Error(`${AssetFailure.FetchFailed}: ${name} answered another range`);
          const bytes = await boundedBytes(response, name, size);
          if (bytes.length !== size) throw new Error(`${AssetFailure.FetchFailed}: ${name} answered ${bytes.length} of ${size} bytes`);
          return bytes;
        }
        if (!response.ok) throw new Error(`${AssetFailure.FetchFailed}: ${name} answered ${response.status}`);
        return (await bodyPrefix(response, name, offset + size)).subarray(offset);
      }

      /** Hand the module the pieces fetched since, oldest first, up to STREAM_HANDOFF_BYTES (at least one). */
      function handOverPieces(game) {
        let budget = STREAM_HANDOFF_BYTES;
        while (streaming.held.length > 0 && (budget === STREAM_HANDOFF_BYTES || streaming.held[0][1].length <= budget)) {
          const [[name, offset], bytes] = streaming.held.shift();
          streaming.heldBytes -= bytes.length;
          budget -= bytes.length;
          try {
            game.studio_assets_arrived(name, offset, bytes);
          } catch (error) {
            // The module refused it (a size or digest it did not plan): nothing was admitted.
            streaming.refused += 1;
            console.warn(`genex: asset ${name} at ${offset} refused: ${error?.message ?? error}`);
          }
        }
      }

      // ── reload: Live's asset swap fetches only the files that changed (game systems C-19a) ──

      /** The module's refusal code at the head of an error's message (`asset-…: detail`), or null. */
      function refusalCode(error) {
        const head = /^([a-z][a-z0-9-]*)[: ]/.exec(String(error?.message ?? error ?? ""));
        return head ? head[1] : null;
      }

      /** One changed file fetched again from inside assets/ and handed to the module in place of its old bytes; a refusal code, or null. */
      async function replaceAsset(game, base, { path, digest }) {
        try {
          const response = landedInside(await fetch(assetUrl(path, base), { cache: "no-store" }), path, base);
          if (!response.ok) return "missing";
          game.studio_assets_replace(path, await boundedBytes(response, path, RELOAD_FILE_MAX_BYTES), digest);
          return null;
        } catch (error) {
          return RELOAD_REFUSALS[refusalCode(error)] ?? "missing";
        }
      }

      /**
       * `reloadAssets({files: [{path, digest}]})`: each named file fetched again (nothing else), its
       * new bytes swapped into the module (which checks the host's FNV-1a 64), then the op, so the
       * next frame draws them. A file the page could not swap is answered refused with its code; a
       * whole refusal answers `{__refused: code}`, as renderSettings.
       */
      async function reloadAssets(game, arg) {
        if (crashes.fatal) return { [REFUSED]: FrameFailure.Failed };
        const files = Array.isArray(arg?.files) ? arg.files : null;
        const named = (file) => typeof file?.path === "string" && typeof file?.digest === "string";
        if (!files || files.length > RELOAD_FILES_MAX || !files.every(named)) return { [REFUSED]: "bad-argument" };
        const base = new URL(ASSETS_DIR, location.href);
        const refused = [];
        const swapped = [];
        for (const file of files) {
          const code = await replaceAsset(game, base, file);
          if (code) refused.push({ path: file.path, code });
          else swapped.push({ path: file.path, digest: file.digest });
        }
