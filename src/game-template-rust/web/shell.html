        if (swapped.length === 0) return { reloaded: [], refused, pending: 0 };
        const reply = JSON.parse(game.studio_call("reloadAssets", JSON.stringify({ files: swapped })));
        if (reply?.ok !== true) return { [REFUSED]: String(reply?.error ?? "") };
        return { ...reply.result, refused: [...refused, ...(reply.result?.refused ?? [])] };
      }

      /** Ask for queued pieces while fewer than ASSET_FETCHES are open; a fetched piece waits for the next frame. */
      function startFetches() {
        while (streaming.open < ASSET_FETCHES && streaming.queued.length > 0) {
          const piece = streaming.queued.shift();
          streaming.open += 1;
          fetchPiece(piece)
            .then((bytes) => {
              streaming.held.push([piece, bytes]);
              streaming.heldBytes += bytes.length;
              streaming.heldMost = Math.max(streaming.heldMost, streaming.heldBytes);
              streaming.fetched += 1;
            })
            .catch((error) => {
              streaming.refused += 1;
              console.warn(`genex: ${error?.message ?? error}`);
            })
            .finally(() => {
              streaming.open -= 1;
              startFetches();
            });
        }
      }

      /**
       * Each frame, before the game's: the pieces fetched since go to the module, then the pieces it
       * wants now are queued and fetched. Bound only when the module exports studio_assets_wanted.
       */
      function streamAssets(game) {
        if (typeof game.studio_assets_wanted !== "function") return;
        handOverPieces(game);
        for (const piece of Array.from(game.studio_assets_wanted())) streaming.queued.push(Array.from(piece));
        startFetches();
      }

      // ── crash reports: the game's records and the shell's own, kept in IndexedDB ──

      /** A record's JSON within the cap, or null (a record over it is not kept). */
      function fittingJson(record) {
        const json = JSON.stringify(record);
        return json.length <= CRASH_RECORD_MAX_BYTES ? json : null;
      }

      /** Keep one record: in the database when it is open, else until it opens. */
      function keepCrash(record) {
        if (!record.context || typeof record.context !== "object") record.context = {};
        record.context.destination ??= WEB_DESTINATION;
        if (fittingJson(record) === null) return;
        crashes.taken.push(record);
        if (crashes.db) writeCrashes();
      }

      /** Write the records taken so far, one after another, pruning the oldest past CRASH_RECORDS_KEPT. */
      function writeCrashes() {
        crashes.writing = crashes.writing.then(async () => {
          const records = crashes.taken.splice(0);
          if (!crashes.db || records.length === 0) return;
          const transaction = crashes.db.transaction(CRASHES_STORE, "readwrite");
          const done = new Promise((resolve) => {
            transaction.oncomplete = () => resolve();
            transaction.onerror = () => resolve();
            transaction.onabort = () => resolve();
          });
          const store = transaction.objectStore(CRASHES_STORE);
          for (const record of records) store.add(record);
          const keys = await settled(store.getAllKeys());
          for (const key of keys.slice(0, Math.max(0, keys.length - CRASH_RECORDS_KEPT))) store.delete(key);
          await done;
        });
        crashes.writing = crashes.writing.catch((error) => console.warn(`genex: crashes: ${error?.name ?? error}`));
        return crashes.writing;
      }

      /** The game's crash database (named by the module), opened before studio_boot; none without IndexedDB or the export. */
      async function openCrashes(game) {
        try {
          if (typeof game.studio_crash_database !== "function" || !window.indexedDB) return;
          const request = indexedDB.open(game.studio_crash_database(), CRASHES_DB_VERSION);
          request.onupgradeneeded = () => {
            if (!request.result.objectStoreNames.contains(CRASHES_STORE)) {
              request.result.createObjectStore(CRASHES_STORE, { autoIncrement: true });
            }
          };
          crashes.db = await settled(request);
          await writeCrashes();
        } catch (error) {
          console.warn(`genex: crashes: ${error?.name ?? error}`);
          crashes.db = null;
        }
      }

      /** Every kept record, newest first (`window.__studio.crashes()`): the database's, or this page's without one. */
      async function readCrashes() {
        await crashes.writing;
        if (!crashes.db) return [...crashes.taken].reverse();
        const store = crashes.db.transaction(CRASHES_STORE, "readonly").objectStore(CRASHES_STORE);
        const kept = await settled(store.getAll());
        return [...kept, ...crashes.taken].reverse();
      }

      /**
       * The module's crash hook hands a record here (`GenexShell.crash(json)`, from inside the panic
       * hook: it never throws). A fatal one means the module is dead: the trap that follows is not
       * recorded again, and nothing calls the module any more. A dead module's later records are dropped.
       */
      function takeGameCrash(json) {
        try {
          if (crashes.fatal) return;
          const record = JSON.parse(json);
          if (record?.format !== CRASH_FORMAT) return;
          if (record.fatal === true) Object.assign(crashes, { fatal: true, panicked: true });
          if (record.kind === CrashKind.DeviceLost) crashes.deviceLost = true;
          keepCrash(record);
        } catch {
          /* a record the shell cannot read is dropped: the panic's console text still follows */
        }
      }

      /** A shell-made record of `kind` with its message and sides (the fields genex-crash/1 requires). */
      function shellRecord(kind, fatal, message, sides = {}) {
        return {
          format: CRASH_FORMAT,
          kind,
          source: CrashSource.Shell,
          fatal,
          handled: false,
          message: String(message ?? "").slice(0, CRASH_MESSAGE_MAX_CHARS),
          location: null,
          thread: null,
          frames: [],
          anchor: null,
          images: [],
          gpu: null,
          wasm: null,
          context: {},
          replay: null,
          profile: null,
          hitches: [],
          symbols: null,
          ...sides,
        };
      }

      /** Whether `error` is a WebAssembly trap (a RuntimeError, or a stack overflow inside the module). */
      function isTrap(error) {
        if (globalThis.WebAssembly?.RuntimeError && error instanceof WebAssembly.RuntimeError) return true;
        return error instanceof RangeError && String(error.stack ?? "").includes("wasm-function[");
      }

      /** What a trap was, by the engine's text (TRAP_TEXTS); a stack overflow outside a RuntimeError is `stack`. */
      function trapKind(error) {
        const text = String(error?.message ?? "").toLowerCase();
        for (const [kind, texts] of TRAP_TEXTS) if (texts.some((known) => text.includes(known))) return kind;
        return error instanceof RangeError ? WasmTrapKind.Stack : WasmTrapKind.Other;
      }

      /** The engine's `wasm-function[N]:0xOFF` frames of a trap, top first. */
      function wasmFrames(error) {
        const frames = [];
        for (const match of String(error?.stack ?? "").matchAll(WASM_FRAME)) {
          if (frames.length >= CRASH_FRAMES_MAX) break;
          frames.push({ func: Number(match[1]), offset: Number.parseInt(match[2], 16) });
        }
        return frames;
      }

      /**
       * A trap that reached the shell: the shell's own fatal `wasm-trap` record, unless a panic's
       * record came first (a panic ends in a trap) or the module was already dead. Answers whether
       * it was a trap.
       */
      function noteTrap(error) {
        if (!isTrap(error)) return false;
        if (!crashes.fatal) {
          const wasm = { trap: trapKind(error), stack: wasmFrames(error) };
          keepCrash(shellRecord(CrashKind.WasmTrap, true, error.message, { wasm }));
        }
        crashes.fatal = true;
        return true;
      }

      /** The class of an uncaptured GPU error, by its type. */
      function gpuErrorClass(error) {
        if (globalThis.GPUOutOfMemoryError && error instanceof GPUOutOfMemoryError) return GpuErrorClass.OutOfMemory;
        if (globalThis.GPUInternalError && error instanceof GPUInternalError) return GpuErrorClass.Internal;
        return GpuErrorClass.Validation;
      }

      /** The GPU side of a shell record (genex-crash/1 `gpu`). */
      function gpuSide(fields) {
        const adapter = shell.adapter?.name ?? null;
        return { class: null, reason: null, backend: "webgpu", adapter, ...fields };
      }

      /**
       * The game's device, watched for crashes: a loss (any reason but destroyed) is the game's own
       * `device-lost` record (its renderer's lost callback, which runs after this one), else, a turn
       * later, the shell's fatal one (the web re-creates a device only by reloading); each distinct
       * uncaptured error is a `gpu-validation` record that is not fatal, up to GPU_ERROR_RECORDS_MAX.
       */
      function watchDeviceCrashes(device) {
        Promise.resolve(device.lost)
          .then((info) => {
            if (!info || info.reason === LOST_DESTROYED) return;
            setTimeout(() => {
              if (crashes.deviceLost) return;
              const description = String(info.message ?? "");
              const gpu = gpuSide({ reason: String(info.reason ?? "unknown"), description });
              keepCrash(shellRecord(CrashKind.DeviceLost, true, description, { gpu }));
            }, 0);
          })
          .catch(() => {});
        device.addEventListener?.("uncapturederror", (event) => {
          const description = String(event?.error?.message ?? "").slice(0, CRASH_MESSAGE_MAX_CHARS);
          const seen = crashes.gpuErrors;
          if (seen.has(description) || seen.size >= GPU_ERROR_RECORDS_MAX) return;
          seen.add(description);
          const gpu = gpuSide({ class: gpuErrorClass(event?.error), description });
          keepCrash(shellRecord(CrashKind.GpuValidation, false, description, { gpu }));
        });
      }

      /** Traps no caller caught: a frame's own are caught in run(); these are the page's leftovers. */
      function listenForTraps() {
        window.addEventListener("error", (event) => noteTrap(event.error));
        window.addEventListener("unhandledrejection", (event) => noteTrap(event.reason));
      }

      // ── the page contract ──

      /** A PNG of a capture for the page contract (the digest stays the BGRA bytes'). */
      function pngOf(capture) {
        const rgba = new Uint8ClampedArray(capture.bgra.length);
        for (let i = 0; i < rgba.length; i += 4) {
          rgba[i] = capture.bgra[i + 2];
          rgba[i + 1] = capture.bgra[i + 1];
          rgba[i + 2] = capture.bgra[i];
          rgba[i + 3] = capture.bgra[i + 3];
        }
        const board = document.createElement("canvas");
        board.width = capture.width;
        board.height = capture.height;
        board.getContext("2d").putImageData(new ImageData(rgba, capture.width, capture.height), 0, 0);
        return board.toDataURL("image/png");
      }

      /** [verb, op, the argument built from the verb's parameter, the answer read from the result] (the C++ shell's table). */
      const VERBS = [
        ["seed", "seed", (n) => ({ seed: n }), (r) => r.seed],
        ["start", "start", () => ({}), () => true],
        ["pause", "pause", () => ({}), () => true],
        ["step", "step", (ms) => ({ ms }), (r) => r],
        ["state", "state", () => ({}), (r) => r],
        ["input", "input", (arg) => arg ?? {}, (r) => r],
        ["debugCamera", "debugCamera", (name) => ({ camera: name ?? null }), (r) => r],
        ["cameras", "cameras", () => ({}), (r) => r.cameras],
        ["eyes", "eyes", () => ({}), (r) => r.eyes],
        ["demos", "demos", () => ({}), (r) => r.demos],
        ["demo", "demo", (name) => ({ name }), (r) => r],
      ];
      /** What a verb the game refused answers on the page: its code, which the studio reads as a native game's refusal. */
      const REFUSED = "__refused";

      /** One op through studio_call: the argument goes in as JSON and the envelope comes back as JSON. */
      function call(game, op, arg) {
        // A dead module is never called again: its state stopped mid-frame.
        if (crashes.fatal) return undefined;
        let reply;
        try {
          reply = JSON.parse(game.studio_call(op, JSON.stringify(arg ?? null)));
        } catch (error) {
          noteTrap(error);
          throw error;
        }
        if (reply?.ok === true) return reply.result;
        console.warn(`${op}: ${reply?.error}`);
        return undefined;
      }

      /** Hand a picture to the capture shim; an older shim only notes it, and without one it is returned as taken. */
      async function throughCaptureShim(url, record) {
        const shim = window.__studioCapture;
        if (typeof shim?.paint === "function") {
          const painted = await Promise.resolve()
            .then(() => shim.paint(url, record))
            .catch(() => null);
          return painted || url;
        }
        try {
          shim?.note?.({ ...record, composited: false });
        } catch {
          /* an older shim has no note to take */
        }
        return url;
      }

      /** The verbs whose page-contract shape differs from the op's (the C++ shell's bindPageShapes). */
      function bindPageShapes(game, api) {
        api.injectInput = (input) => {
          const look = { x: input?.look?.dx || 0, y: input?.look?.dy || 0 };
          const wheel = { x: input?.wheel?.dx || 0, y: input?.wheel?.dy || 0 };
          const result = call(game, "input", { down: input?.down ?? [], up: input?.up ?? [], look, wheel });
          return { keys: result?.held ?? [], look, wheel };
        };
        api.eye = (name) => api.debugCamera(name);
        /** The renderer's quality, read (`{}`) or changed (`{set}`), as the native op; a refusal answers `{__refused: code}`. */
        api.renderSettings = (arg) => {
          const reply = JSON.parse(game.studio_call("renderSettings", JSON.stringify(arg ?? {})));
          return reply?.ok === true ? reply.result : { [REFUSED]: String(reply?.error ?? "") };
        };
        api.player = () => api.state()?.player ?? null;
        /**
         * `audio({muted})` mutes the device; `audio()` is the level probe: the game's own mix before
         * the mute (`studio_audio_level`), whether or not the first gesture opened the device yet.
         */
        api.audio = (arg) => {
          if (typeof arg?.muted === "boolean") return call(game, "audio", { muted: arg.muted });
          if (typeof game.studio_audio_level !== "function") return { available: false, rms: 0, centroid: 0 };
          try {
            return JSON.parse(game.studio_audio_level());
          } catch {
            return { available: false, rms: 0, centroid: 0 };
          }
        };
        // Bound only when the module exports its capture, as the C++ shell binds each verb.
        if (typeof game.studio_capture !== "function") return;
        /** Draws the view, awaits the world-target readback and goes through the capture shim; never the canvas. */
        api.capture = async (camera) => {
          const result = call(game, "capture", camera ? { camera } : {});
          if (result === undefined) return null;
          const pixels = await game.studio_capture();
          const url = pngOf(pixels);
          // The world target's digest and size travel with the picture: capture provenance and the
          // web-versus-native parity row compare them.
          const record = {
            reason: url ? null : "the game's own capture produced no image",
            drawCalls: result.drawCalls ?? null,
            ladder: ["render"],
            digest: pixels.digest,
            width: pixels.width,
            height: pixels.height,
          };
          return throughCaptureShim(url, record);
        };
      }

      function bindStudio(game) {
        const api = { version: 1 };
        // Every verb goes through studio_call: a module without it gets no verbs (the C++ shell's rule).
        if (typeof game.studio_call === "function") {
          for (const [verb, op, argument, answer] of VERBS) {
            api[verb] = (value) => {
              const result = call(game, op, argument(value));
              return result === undefined ? undefined : answer(result);
            };
          }
          bindPageShapes(game, api);
          /** The dev profile verb (`{action, frames?, mode?}`); a refusal answers `{__refused: code}`, as renderSettings. */
          api.profile = (request) => {
            if (crashes.fatal) return { [REFUSED]: FrameFailure.Failed };
            const reply = JSON.parse(game.studio_call("profile", JSON.stringify(request ?? {})));
            return reply?.ok === true ? reply.result : { [REFUSED]: String(reply?.error ?? "") };
          };
          // Bound only when the module can swap a file's bytes: Studio asks for the verb before it
          // places anything, and a page without it is reloaded instead.
          if (typeof game.studio_assets_replace === "function") api.reloadAssets = (arg) => reloadAssets(game, arg);
        }
        api.crashes = readCrashes;
        window.__studio = api;
        shell.hex = hex;
      }

      /**
       * The display's refresh interval in ms from recent frame intervals: the rate in use while
       * their median stays near it, else the nearest listed rate, else null (unknown).
       */
      function displayRefresh(samples, current) {
        if (samples.length < REFRESH_SAMPLES) return current;
        const sorted = [...samples].sort((a, b) => a - b);
        const median = sorted[Math.floor(sorted.length / 2)];
        const off = (interval) => Math.abs(median - interval) / interval;
        if (current !== null && off(current) <= DISPLAY_RATE_KEEP) return current;
        const intervals = DISPLAY_RATES_HZ.map((hz) => 1000 / hz).filter((interval) => off(interval) <= DISPLAY_RATE_TOLERANCE);
        intervals.sort((a, b) => off(a) - off(b));
        return intervals[0] ?? null;
      }

      /**
       * What one animation frame feeds the game: whole display refreshes, never the frame's own
       * time. A browser stamps frames with its main thread's jitter (±2 ms on a busy page), and the
       * sim turns frame times into fixed 1000/60 ms ticks: near a tick's boundary, whether two
       * 120 Hz refreshes made a tick was a coin toss, so frames were drawn 8 and 25 ms apart. The
       * time not fed yet is carried (`owed`), so none is lost, and it is rounded to refreshes
       * around its own running mean (`phase`), so the jitter stays clear of a half refresh. On a
       * display the shell does not recognise (yet) the frame's own time is fed.
       */
      function pacedFrameMs(pacer, ms) {
        if (ms > 0 && ms < REFRESH_SAMPLE_MAX_MS) {
          pacer.samples.push(ms);
          if (pacer.samples.length > REFRESH_SAMPLES) pacer.samples.shift();
        }
        pacer.refresh = displayRefresh(pacer.samples, pacer.refresh);
        const refresh = pacer.refresh;
        if (refresh === null) {
          const fed = pacer.owed + ms;
          Object.assign(pacer, { owed: 0, phase: 0 });
          return fed;
        }
        pacer.owed += ms;
        const fed = Math.max(0, Math.round((pacer.owed - pacer.phase) / refresh)) * refresh;
        pacer.owed -= fed;
        pacer.phase += (pacer.owed - pacer.phase) * PHASE_FOLLOW;
        return fed;
      }

      function run(game, input) {
        let last = performance.now();
        let first = true;
        const pacer = { samples: [], refresh: null, owed: 0, phase: 0 };
        const frame = (now) => {
          // A crash ended the module (in a verb, or a frame of its own): no frame calls it again.
          if (crashes.fatal) {
            if (status.state === State.Running) Object.assign(status, { state: State.Failed, code: FrameFailure.Failed });
            return;
          }
          const ms = pacedFrameMs(pacer, Math.min(MAX_FRAME_MS, Math.max(0, now - last)));
          last = now;
          try {
            pollGamepads(game, input);
            streamAssets(game);
            if (game.studio_frame(ms) > 0) input.ticked = true;
            // The first animation frame always draws and presents (the presenter's frame gate).
            if (first) awaitFirstLitFrame();
            first = false;
            scheduleIdleFlush(game);
            serveSaveRequests(game);
          } catch (error) {
            if (error?.code === FrameFailure.DeviceLost) {
              showDeviceLost(game, error);
              return;
            }
            noteTrap(error);
            Object.assign(status, { state: State.Failed, code: FrameFailure.Failed, reason: String(error?.message ?? error) });
            return;
          }
          requestAnimationFrame(frame);
        };
        requestAnimationFrame(frame);
      }

      /**
       * Where the presenter draws the world inside a canvas of `width` × `height` pixels: the largest
       * aspect-preserving fit, centred, in whole pixels (genex-render's `letterbox`, the same arithmetic).
       */
      function letterbox(width, height, [worldWidth, worldHeight]) {
        const widthLimited = width * worldHeight <= height * worldWidth;
        const fitWidth = widthLimited ? width : Math.floor((height * worldWidth) / worldHeight);
        const fitHeight = widthLimited ? Math.floor((width * worldHeight) / worldWidth) : height;
        const x = Math.floor((width - fitWidth) / 2);
        const y = Math.floor((height - fitHeight) / 2);
        return { x, y, width: fitWidth, height: fitHeight };
      }

      /**
       * A page pointer event as the `input` verb's pointer, a fraction of the world picture, or null
       * on a letterbox bar. The canvas's own size when the boot named no world.
       */
      function worldPointer(event) {
        const box = canvas.getBoundingClientRect();
        if (box.width <= 0 || box.height <= 0) return null;
        const world = shell.world ?? [canvas.width, canvas.height];
        const view = letterbox(canvas.width, canvas.height, world);
        const x = ((event.clientX - box.left) / box.width) * canvas.width - view.x;
        const y = ((event.clientY - box.top) / box.height) * canvas.height - view.y;
        const inside = x >= 0 && y >= 0 && x < view.width && y < view.height;
        return inside ? { x: x / view.width, y: y / view.height } : null;
      }

      /** A wheel event's movement in pixels: lines count WHEEL_LINE_PX, pages the canvas's height. */
      function wheelPixels(event) {
        const unit = [1, WHEEL_LINE_PX, canvas.clientHeight || WHEEL_LINE_PX][event.deltaMode] ?? 1;
        return { x: event.deltaX * unit, y: event.deltaY * unit };
      }

      /** The most characters of a pad's Gamepad.id sent (its vendor and product ids lead it). */
      const PAD_ID_MAX_CHARS = 128;
      /** The most keys of the keyboard's layout map sent, and the longest key code and label kept. */
      const LAYOUT_KEYS_MAX = 256;
      const LAYOUT_CODE_MAX_CHARS = 64;
      const LAYOUT_LABEL_MAX_CHARS = 8;

      /**
       * Real pads as the `input` verb's `pads` (the browser's standard mapping is the protocol's
       * order), each with its Gamepad.id so the game can tell its family (Safari's names no vendor:
       * generic), sent when one changed; a pad that went away is sent once as disconnected.
       */
      function pollGamepads(game, input) {
        const pads = typeof navigator.getGamepads === "function" ? [...navigator.getGamepads()] : [];
        const now = pads.filter(Boolean).map((pad) => ({
          index: pad.index,
          connected: pad.connected,
          buttons: [...pad.buttons].map((button) => Math.max(button.value, button.pressed ? 1 : 0)),
          axes: [...pad.axes],
          id: String(pad.id ?? "").slice(0, PAD_ID_MAX_CHARS),
        }));
        const gone = [...input.pads.keys()].filter((index) => !now.some((pad) => pad.index === index));
        const changed = now.filter((pad) => input.pads.get(pad.index) !== JSON.stringify(pad));
        if (changed.length === 0 && gone.length === 0) return;
        for (const index of gone) input.pads.delete(index);
        for (const pad of changed) input.pads.set(pad.index, JSON.stringify(pad));
        call(game, "input", { pads: [...changed, ...gone.map((index) => ({ index, connected: false }))] });
      }

      /**
       * The keyboard's labels per key code (`{KeyW: "z"}` on AZERTY) as the `input` verb's `layout`,
       * sent once where the browser offers `navigator.keyboard.getLayoutMap()` (Chromium). Display
       * only: the game shows them beside its bindings and never reads a key by its label.
       */
      async function forwardKeyboardLayout(game) {
        const keyboard = navigator.keyboard;
        if (typeof keyboard?.getLayoutMap !== "function") return;
        const map = await Promise.resolve()
          .then(() => keyboard.getLayoutMap())
          .catch(() => null);
        if (!map || typeof map.forEach !== "function") return;
        const layout = Object.create(null);
        let kept = 0;
        map.forEach((label, code) => {
          const fits = typeof code === "string" && code.length <= LAYOUT_CODE_MAX_CHARS;
          const readable = typeof label === "string" && label.length <= LAYOUT_LABEL_MAX_CHARS;
          if (kept >= LAYOUT_KEYS_MAX || !fits || !readable) return;
          layout[code] = label;
          kept += 1;
        });
        if (kept > 0) call(game, "input", { layout });
      }

      /** Release every key and button the page holds (focus left the game: its keyup would go elsewhere). */
      function releaseAll(game, input) {
        const held = [...input.held];
        if (held.length === 0) return;
        input.held.clear();
        call(game, "input", { up: held });
      }

      /**
       * The page's input as the `input` verb: keys while the canvas has focus, released all at once
       * when focus or the page goes; Mouse1 held from pointerdown to pointerup (a click no tick saw
       * is sent as a tap too, so it is never lost), the pointer and, while it is held or the pointer
       * is locked, its movement as `look`; the wheel; real gamepads polled each animation frame.
       */
      function listen(game) {
        const input = { held: new Set(), pads: new Map(), ticked: false };
        const keyEvent = (field) => (event) => {
          if (event.repeat) return;
          if (field === "down") input.held.add(event.code);
          else input.held.delete(event.code);
          call(game, "input", { [field]: [event.code] });
          event.preventDefault();
        };
        canvas.addEventListener("keydown", keyEvent("down"));
        canvas.addEventListener("keyup", keyEvent("up"));
        canvas.addEventListener("blur", () => releaseAll(game, input));
        window.addEventListener("blur", () => releaseAll(game, input));
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "hidden") releaseAll(game, input);
        });
        canvas.addEventListener("pointerdown", (event) => {
          canvas.focus();
          const pointer = worldPointer(event);
          // A press on a letterbox bar is on no part of the game.
          if (!pointer) return;
          canvas.setPointerCapture?.(event.pointerId);
          input.held.add(MOUSE1);
          input.ticked = false;
          call(game, "input", { pointer, down: [MOUSE1] });
        });
        canvas.addEventListener("pointerup", () => {
          if (!input.held.delete(MOUSE1)) return;
          call(game, "input", input.ticked ? { up: [MOUSE1] } : { up: [MOUSE1], tap: [MOUSE1] });
        });
        canvas.addEventListener("pointercancel", () => {
          if (input.held.delete(MOUSE1)) call(game, "input", { up: [MOUSE1] });
        });
        canvas.addEventListener("pointermove", (event) => {
          const looking = input.held.has(MOUSE1) || document.pointerLockElement === canvas;
          if (!looking || (event.movementX === 0 && event.movementY === 0)) return;
          const ratio = window.devicePixelRatio || 1;
          call(game, "input", { look: { x: event.movementX * ratio, y: event.movementY * ratio } });
        });
        canvas.addEventListener(
          "wheel",
          (event) => {
            call(game, "input", { wheel: wheelPixels(event) });
            event.preventDefault();
          },
          { passive: false },
        );
        forwardKeyboardLayout(game).catch(() => {});
        return input;
      }

      async function boot() {
        progress(LoadStage.Wasm);
        const refusal = await preflight();
        if (refusal) return showUnsupported(refusal);
        const params = new URLSearchParams(location.search);
        const game = await import("./game.js");
        const module = await fetchWasm();
        await game.default(module ? { module_or_path: module } : undefined);
        shell.module = game;
        // The crash records' database first: a panic in the boot below is kept too.
        await openCrashes(game);
        // The saves and the assets first: studio_boot starts the game, and its first reset reads them.
        await preloadSaves(game);
        await preloadAssets(game);
        canvas.hidden = false;
        followCanvasSize();
        progress(LoadStage.Device);
        progress(LoadStage.Pipelines);
        gpuHooks.plan = await listPipelines(module).catch(() => null);
        if (status.state !== State.Starting) return;
        const answer = JSON.parse(await game.studio_boot(canvas, deviceHints()));
        if (status.state !== State.Starting) return;
        if (!answer.ok) {
          canvas.hidden = true;
          return showUnsupported(answer);
        }
        progress(LoadStage.Frame);
        Object.assign(status, { state: State.Running, receipt: answer.receipt });
        const [worldWidth, worldHeight] = Array.isArray(answer.world) ? answer.world : [];
        if (worldWidth > 0 && worldHeight > 0) shell.world = [worldWidth, worldHeight];
        bindStudio(game);
        const input = listen(game);
        listenForSaves(game);
        if (!params.has("paused")) window.__studio.start();
        run(game, input);
      }

      watchPageGpu();
      listenForTraps();
      boot().catch((error) => {
        noteTrap(error);
        if (status.state === State.Starting) showFailed(error);
      });
    </script>
  </body>
</html>
