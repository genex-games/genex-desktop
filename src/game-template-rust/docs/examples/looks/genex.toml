# The look recipes' manifest (copy it over the game's own genex.toml, keeping your title).
[game]
title = "Looks"
fit = "expand"

# Authored for ultra on a desktop; check it stays readable at `low` and as a phone.
[render]
form_factors = ["desktop", "mobile"]
preset = "auto"

# Each recipe sets its exposure, fog and grade in code on top of this (`looks.rs`).
[render.look]
tonemapper = "agx-punchy"
exposure = "auto"

# The street is 60 m long: the sun's cascades cover 60 m.
[render.shadows]
distance = 60

[physics]
enabled = false

[audio]
enabled = false

[nav]
enabled = false

[streaming]
enabled = false

[animation]
enabled = false
