# The soldier kit example's manifest (copy it over the game's own genex.toml, keeping your title).
[game]
title = "Soldier kit"
fit = "expand"

[render]
form_factors = ["desktop", "mobile"]
preset = "auto"

[render.look]
tonemapper = "agx-punchy"
exposure = "auto"
ev_compensation = 0.5

# The kit is a rigged GLB on an animator; nothing here needs physics.
[physics]
enabled = false

[animation]
enabled = true

[audio]
enabled = false

[nav]
enabled = false

[streaming]
enabled = false
