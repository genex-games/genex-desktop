<!doctype html>
<html><head><meta charset="utf-8"><style>
body{font:14px system-ui;padding:16px;color:var(--studio-fg,#ddd);background:var(--studio-bg,#222)}
button{padding:8px 12px;background:#ffffff12;color:inherit;border:1px solid #ffffff30;border-radius:8px;cursor:pointer}
button:hover{background:#ffffff24}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:2px solid #999}
pre{white-space:pre-wrap;overflow-wrap:anywhere}#jobs{display:grid;gap:8px}#path{overflow-wrap:anywhere}progress{width:100%}
</style></head><body>
<h2>Local Blender</h2>
<p>Model assets on this computer. No Genex account or credits are used. Enabling this plugin makes its tools available in this chat’s next response.</p>
<p id="status" role="status">Checking runtime…</p><p id="path"></p>
<button id="recheck">Recheck</button> <button id="install" hidden>Download pinned Blender</button> <button id="cancel" hidden>Cancel download</button>
<p id="installation" role="status"></p><progress id="progress" hidden></progress>
<pre id="error" role="alert"></pre><div id="jobs"></div>
<!-- STUDIO_PANEL_SDK -->
<script>
const api=window.studioPlugin,$=id=>document.getElementById(id);
let busy=false,refreshing=false,last='',closed=false;
function installButton(runtime, installation){
  const externalReady=runtime.state==='ready'&&runtime.managed===false;
  $('install').hidden=!runtime.install||(runtime.state==='ready'&&!externalReady);
  $('install').disabled=busy||!!installation?.active;
  $('install').textContent=externalReady?'Install private Blender copy':'Download pinned Blender';
}
async function refresh(){
  if(refreshing||closed)return;refreshing=true;
  try{
    const s=await api.call('action','status',{});if(closed)return;
    $('status').textContent=s.runtime.detail;$('path').textContent=s.runtime.path||'';
    installButton(s.runtime,s.installation);
    const job=s.installation;
    $('cancel').hidden=!job?.active;$('progress').hidden=!job?.active;
    if(job){
      $('installation').textContent=`Download: ${job.phase} · ${Math.round(job.completed/1048576)} / ${Math.round(job.total/1048576)} MiB${job.error?' · '+job.error:''}`;
      $('progress').max=job.total;$('progress').value=job.completed;
    }
    const key=JSON.stringify(s.jobs);
    if(key!==last){last=key;$('jobs').replaceChildren(...s.jobs.slice(-10).reverse().map(j=>{const p=document.createElement('p');p.textContent=j.state+' · '+j.id+(j.reason?' · '+j.reason:'');return p;}));}
  }catch(e){if(!closed)$('error').textContent=String(e);}finally{refreshing=false;}
}
$('recheck').onclick=()=>{$('error').textContent='';void refresh();};
$('install').onclick=async()=>{
  if(busy)return;busy=true;$('install').disabled=true;$('error').textContent='';
  try{await api.call('action','install',{}, {timeoutMs:1800000});}
  catch(e){if(!closed)$('error').textContent=String(e);}
  finally{busy=false;if(!closed){$('install').disabled=false;void refresh();}}
};
$('cancel').onclick=async()=>{try{await api.call('action','cancel-install',{});await refresh();}catch(e){$('error').textContent=String(e);}};
void api.call('context').then(c=>{document.body.style.setProperty('--studio-bg',c.theme.background);document.body.style.setProperty('--studio-fg',c.theme.foreground);});
void refresh();const timer=setInterval(refresh,2000);window.addEventListener('pagehide',()=>{closed=true;clearInterval(timer);});
</script></body></html>
