<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genex tab prototype</title>
<script type="importmap">{ "imports": { "proto-mapped": "data:text/javascript,export const mapped = true;" } }</script>
<style>
	:root { color-scheme: dark; --bg: #141416; --fg: #e8e8ea; --line: #2a2a30; }
	body { margin: 0; font: 15px/1.4 -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--fg); }
	main { padding: 16px; display: grid; gap: 12px; }
	.small { font-size: 13px; }
	input, textarea { font: inherit; background: #1d1d21; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
	textarea { min-height: 80px; }
	#list { height: 240px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
	#list div { padding: 4px 8px; border-bottom: 1px solid var(--line); }
	#status { font-weight: 600; }
	.nest { & span { color: #8fd18f; } }
	@container (min-width: 1px) { .cq { color: inherit; } }
</style>
</head>
<body>
<main>
	<div id="status">Genex tab prototype: loading…</div>
	<div class="small">This is a line of 13px text to judge sharpness: The quick brown fox jumps over the lazy dog 0123456789.</div>
	<input id="field" placeholder="Type here">
	<textarea id="area" placeholder="And here"></textarea>
	<div id="list"></div>
	<div class="nest"><span>nested</span></div>
</main>
<script type="module">
	await Promise.resolve();
	window.__tla = true;
</script>
<script type="module">
	import { mapped } from "proto-mapped";
	window.__importmap = mapped === true;
</script>
<script>
	const RUN = new URLSearchParams(location.search).get("run") || "none";
	const EVENT_FLUSH_MS = 500;
	const COLLECT_AFTER_MS = 1500;

	function post(payload) {
		return fetch("/result", {
			method: "POST",
			headers: { "content-type": "application/json" },
			body: JSON.stringify({ run: RUN, ...payload }),
		}).catch(() => undefined);
	}

	const list = document.getElementById("list");
	for (let i = 1; i <= 200; i++) {
		const row = document.createElement("div");
		row.textContent = `Row ${i}`;
		list.appendChild(row);
	}

	let pending = [];
	function logEvent(event) {
		const target = event.target && event.target.id ? event.target.id : event.target === window ? "window" : "other";
		pending.push({ type: event.type, target, key: event.type === "keydown" ? event.key : undefined, t: Math.round(performance.now()) });
	}
	for (const type of ["keydown", "input", "paste", "focus", "blur", "wheel"]) {
		window.addEventListener(type, logEvent, { capture: true, passive: true });
	}

	// Typing test: keydown, input and paste each POST at once, with what they carried.
	function fieldName(event) {
		return event.target && event.target.id ? event.target.id : "other";
	}
	const now = () => Math.round(performance.now());
	window.addEventListener("keydown", (event) => {
		post({ kind: "keydown", field: fieldName(event), key: event.key, code: event.code, repeat: event.repeat, composing: event.isComposing, t: now() });
	}, { capture: true, passive: true });
	window.addEventListener("input", (event) => {
		post({ kind: "input", field: fieldName(event), inputType: event.inputType, data: event.data, value: event.target.value, t: now() });
	}, { capture: true, passive: true });
	window.addEventListener("paste", (event) => {
		const text = event.clipboardData ? event.clipboardData.getData("text/plain") : null;
		post({ kind: "paste", field: fieldName(event), text, t: now() });
	}, { capture: true, passive: true });
	setInterval(() => {
		if (pending.length === 0) return;
		const events = pending;
		pending = [];
		post({ kind: "events", events });
	}, EVENT_FLUSH_MS);

	function cssSupports(text) {
		try {
			return CSS.supports(text);
		} catch {
			return false;
		}
	}
	function selectorSupports(selector) {
		try {
			return CSS.supports(`selector(${selector})`);
		} catch {
			return false;
		}
	}
	function nestingWorks() {
		const span = document.querySelector(".nest span");
		return getComputedStyle(span).color === "rgb(143, 209, 143)";
	}
	function localStorageWorks() {
		try {
			localStorage.setItem("proto", "1");
			const ok = localStorage.getItem("proto") === "1";
			localStorage.removeItem("proto");
			return ok;
		} catch {
			return false;
		}
	}
	async function fetchStreaming() {
		try {
			const response = await fetch("/?stream-probe=1");
			if (!response.body || typeof response.body.getReader !== "function") return false;
			const reader = response.body.getReader();
			const first = await reader.read();
			await reader.cancel();
			return !first.done && first.value instanceof Uint8Array;
		} catch {
			return false;
		}
	}

	function features() {
		return {
			cssHas: selectorSupports(":has(a)"),
			cssNesting: nestingWorks(),
			containerQueries: cssSupports("container-type: inline-size"),
			colorMix: cssSupports("color: color-mix(in srgb, red, blue)"),
			oklch: cssSupports("color: oklch(0.5 0.1 200)"),
			backdropFilter: cssSupports("backdrop-filter: blur(4px)") || cssSupports("-webkit-backdrop-filter: blur(4px)"),
			focusVisible: selectorSupports(":focus-visible"),
			viewTransitions: typeof document.startViewTransition === "function",
			webSocket: typeof WebSocket === "function",
			eventSource: typeof EventSource === "function",
			readableStream: typeof ReadableStream === "function",
			resizeObserver: typeof ResizeObserver === "function",
			intersectionObserver: typeof IntersectionObserver === "function",
			structuredClone: typeof structuredClone === "function",
			arrayAt: typeof Array.prototype.at === "function",
			topLevelAwait: window.__tla === true,
			importMaps: window.__importmap === true,
			subgrid: cssSupports("grid-template-columns: subgrid"),
			dvh: cssSupports("height: 100dvh"),
			clipboardApi: typeof navigator.clipboard === "object" && navigator.clipboard !== null,
			localStorage: localStorageWorks(),
		};
	}

	function listenForPush() {
		let arrived = false;
		const source = new EventSource("/events");
		source.onmessage = (message) => {
			arrived = true;
			post({ kind: "push", arrived: true, data: message.data });
			source.close();
		};
		setTimeout(() => {
			if (!arrived) post({ kind: "push", arrived: false });
			source.close();
		}, 5000);
	}

	window.addEventListener("load", () => {
		post({ kind: "loaded", href: location.href, t: Math.round(performance.now()) });
		setTimeout(async () => {
			const result = {
				kind: "probe",
				userAgent: navigator.userAgent,
				devicePixelRatio: window.devicePixelRatio,
				innerWidth: window.innerWidth,
				innerHeight: window.innerHeight,
				features: { ...features(), fetchStreaming: await fetchStreaming() },
			};
			const failing = Object.entries(result.features).filter(([, ok]) => !ok).map(([name]) => name);
			result.failing = failing;
			await post(result);
			document.getElementById("status").textContent = `Genex tab prototype: probe sent (${failing.length} features missing)`;
			listenForPush();
		}, COLLECT_AFTER_MS);
	});
</script>
</body>
</html>
