# The custom GPU pass sample's manifest: the WGSL sources its two Level-3 passes (halo, CRT) and its
# Level-2 material (glow, extension API v2) and post pass (vignette, v1) are written in. In this
# workspace it is read as data: the facade checks each Level-2 source's row (kind, api) before
# admitting it. The halo is a v1 in-world pass: it keeps the sample's frame on the LDR scene.
[game]
title = "Custom pass"
world_size = [160, 90]

# The game systems it does not use stay out of its build; the Cargo.toml names the same set as genex
# features (release R-3), physics among them.

# Sounds and music: genex::audio and ctx.audio (docs/api/audio.md).
[audio]
enabled = false

# Walkers that find paths: game.navigation and sim.nav (docs/api/navigation.md).
[nav]
enabled = false

# A world streamed in cells round the player: game.streaming (docs/api/streaming.md).
[streaming]
enabled = false

# Animated characters: gfx.character and the Animator (docs/api/animation.md).
[animation]
enabled = false

[[wgsl]]
path = "shaders/halo.wgsl"
kind = "pass"

[[wgsl]]
path = "shaders/crt.wgsl"
kind = "pass"

[[wgsl]]
path = "shaders/glow.wgsl"
kind = "material"
api = 2

[[wgsl]]
path = "shaders/vignette.wgsl"
kind = "post"
api = 1
