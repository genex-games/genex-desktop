# The custom GPU pass sample (M2.19, extension ladder level 3): a game that registers raw wgpu
# passes through `genex::gpu`, an in-world halo that follows the simulation and a post-stage CRT
# filter, with goldens rendered on the host GPU (tests/fixtures/render-goldens/custom-pass).
[package]
name = "custom-pass"
description = "The custom GPU pass sample game (M2.19)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "custom_pass_game"

[[bin]]
name = "custom-pass"
path = "src/main.rs"

# The dev flavour serves the studio through `genex::install` (the facade's `studio` feature); an
# export is built with `--no-default-features`.
[features]
default = ["studio"]
studio = ["genex/studio"]

[dependencies]
genex = { workspace = true, features = ["physics"] }

# The golden rows render headless on the host GPU (Metal on the Mac) through genex-render, with
# the web shell's frame-to-scene bridge.
[dev-dependencies]
genex-render = { workspace = true }
genex-platform-web = { workspace = true }
wgpu = { workspace = true }
