# net-tag's manifest. `[net] enabled = true` marks the game networked: a Live, dev or judge build
# plays in the loopback room (`net-loopback`), an export links the relay (`net`). The matchmaking
# preset is carried to the relay with the published draft; net-tag connects to its shared room and
# keeps the preset for a Find match button.
[game]
title = "Net tag"
world_size = [960, 540]

[physics]
enabled = false

# The game systems it does not use stay out of its build, which keeps the web export under 4 MiB
# (release R-3); the Cargo.toml names the same set as genex features.

# Sounds and music: genex::audio and ctx.audio (docs/api/audio.md).
[audio]
enabled = false

# Walkers that find paths: game.navigation and sim.nav (docs/api/navigation.md).
[nav]
enabled = false

# A world streamed in cells round the player: game.streaming (docs/api/streaming.md).
[streaming]
enabled = false

# Animated characters: gfx.character and the Animator (docs/api/animation.md).
[animation]
enabled = false

[net]
enabled = true

[net.matchmaking]
preset = "open"
win_condition = "firstToScore"

[net.matchmaking.config]
maxPlayers = 8
minPlayers = 2
