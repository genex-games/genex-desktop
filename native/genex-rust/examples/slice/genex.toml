# The vertical slice's manifest: streamed cells bringing colliders (physics) and nav islands
# (navigation), and an animated walker. Every game system but sound stays on.
[game]
title = "Vertical slice"
world_size = [960, 540]

# The game systems it does not use stay out of its build, which keeps the web export under 4 MiB
# (release R-3); the Cargo.toml names the same set as genex features.

# Sounds and music: genex::audio and ctx.audio (docs/api/audio.md).
[audio]
enabled = false
