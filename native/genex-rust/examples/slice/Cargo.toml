# The vertical slice (EP-V1): a procedural streamed world of 16 m cells (3x3 simulated round the
# walker), each cell bringing its static colliders and a real genex-nav island through the stream
# commit, one animated walker driven by nav through the documented loop with root motion, and
# villagers that freeze off the mesh when their cell streams out. One crate serves every
# destination, as the pond does: the `slice` binary is the native build and the library is also a
# `cdylib` for the web shell. The one asset, `assets/walker.glb`, is generated by
# `tests/walker_glb.rs` (procedural, no third-party content).
[package]
name = "slice"
description = "The vertical slice example game (EP-V1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
# Not `slice`: on wasm32 the library and the binary would both be `slice.wasm`.
name = "slice_game"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "slice"
path = "src/main.rs"

# The dev flavour serves the studio through `genex::install`; the export flavour is built with
# `--no-default-features` and never links genex-studio.
[features]
default = ["studio"]
studio = ["genex/studio"]

[dependencies]
# The game systems it uses, as its genex.toml switches them on (release R-1).
genex = { workspace = true, features = ["physics", "nav", "streaming", "animation"] }
genex-platform-web = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }

# tests/slice.rs runs the stream pool with 1 and 8 workers (genex-render's job pool); tests/captures.rs
# writes the settled captures as PNG evidence on the host GPU.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
genex-render = { workspace = true }
image = { workspace = true }
