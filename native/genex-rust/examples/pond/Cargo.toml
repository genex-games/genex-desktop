# The pond sample (M0a.7): a GLB pond rim, PBR-lite shading, Rapier floaters, an egui shop button
# and a device-less splash sound, on the genex facade. One crate serves every destination: the
# `pond` binary is the native build (with the spike-only `--self-test <ticks>` mode) and the
# library is also a `cdylib`, which `scripts/spike/rust-wgpu/web.sh` passes through wasm-bindgen
# and wasm-opt for the web shell (`native/genex-rust/web/shell.html`).
[package]
name = "pond"
description = "The pond sample game (M0a.7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
# Not `pond`: on wasm32 the library and the binary would both be `pond.wasm`.
name = "pond_game"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pond"
path = "src/main.rs"

# The dev flavour serves the studio through `genex::install` (the facade's `studio` feature); the
# export flavour is built with `--no-default-features` and never links genex-studio
# (export-standalone.sh checks both).
[features]
default = ["studio"]
studio = ["genex/studio"]

[dependencies]
genex = { workspace = true, features = ["physics", "physics-raw"] }
# The splash plays through genex-audio's own mixer (its `mixer` feature, G6 AU-11).
genex-audio = { workspace = true, features = ["mixer"] }
genex-platform-web = { workspace = true }

# The native self-test renders headless on the host GPU (Metal on the Mac).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
genex-render = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
