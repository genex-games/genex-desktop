# The nav-crowd example (NAV-17): 200 agents walking a walled two-floor market on the genex facade,
# each a character capsule moved through the documented nav loop (no nav driver), with a ladder,
# a stair ramp, a drop, a door on a timer, a player body and a crate carved in at tick 600. One
# crate serves every destination, as the pond does: the `nav-crowd` binary is the native build
# and the library is also a `cdylib` for the web shell. No assets: the scene is procedural.
[package]
name = "nav-crowd"
description = "The nav-crowd example game (NAV-17)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
# Not `nav_crowd`: on wasm32 the library and the binary would both be `nav-crowd.wasm`.
name = "nav_crowd_game"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "nav-crowd"
path = "src/main.rs"

# The dev flavour serves the studio through `genex::install`; the export flavour is built with
# `--no-default-features` and never links genex-studio.
[features]
default = ["studio"]
studio = ["genex/studio"]

[dependencies]
# The game systems it uses, as its genex.toml switches them on (release R-1).
genex = { workspace = true, features = ["physics", "physics-raw", "nav"] }
genex-platform-web = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }

# tests/captures.rs writes the settled captures as PNG evidence on the host GPU.
[dev-dependencies]
image = { workspace = true }
