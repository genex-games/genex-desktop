[package]
name = "genex-physics-wasm"
description = "The WebAssembly binding of Genex Physics (contract 1.0): the wasm-bindgen exports under the @genex-ai/physics npm package, a thin shell over genex-physics-binding's registry, with a counting allocator that charges every allocation to its world (§11.1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

# cdylib is the .wasm `scripts/physics-wasm.ts` builds for wasm32-unknown-unknown; rlib lets this
# crate's own tests (and clippy) run natively, where the same counting allocator is installed.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# A `test_trap` export that panics, so the package's poison rows (§11.3) can make the instance trap.
# Only the test build (`scripts/physics-wasm.ts --test-build`) turns it on; the published one never.
test-trap = []

[dependencies]
# All three already locked and vendored (no new crate): the core (its counting allocator), the
# host-neutral binding every export forwards to, and the bindgen glue the web shell uses too.
genex-physics = { workspace = true }
genex-physics-binding = { workspace = true }
wasm-bindgen = { workspace = true }

[dev-dependencies]
# The shell's own test reads an export's JSON result.
serde_json = { workspace = true }
