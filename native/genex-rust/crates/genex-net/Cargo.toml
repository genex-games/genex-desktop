[package]
name = "genex-net"
description = "Multiplayer for genex games: the network as an input stream (one NetFrame per tick, a journal, a queued write set) over Off, Loopback, Relay and Replay backends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

# Backends are chosen by the build, never by game code. `relay` links the vendored
# genex-multiplayer client (native libcolyseus through the store's GENEX_COLYSEUS_LIB_DIR) for
# exports; `loopback` marks Live, dev, judge and device builds, which link no network code.
[features]
default = []
relay = ["dep:genex-multiplayer", "genex-multiplayer/native"]
loopback = []

[dependencies]
# `Map`/`Set` live below the facade, so this crate shares them with a game; glam carries the
# protocol's flat pose, serde_json the JSON states and libm the sim-time interpolator.
genex-core = { workspace = true }
glam = { workspace = true }
serde_json = { workspace = true }
libm = { workspace = true }
genex-multiplayer = { workspace = true, optional = true }

# On wasm32 the same optional dependency also turns on the crate's `web` half (the browser bridge,
# `relay/web.rs`); its wasm-bindgen crates are already in the lock and the vendored tree.
[target.'cfg(target_arch = "wasm32")'.dependencies]
genex-multiplayer = { workspace = true, optional = true, features = ["web"] }

[dev-dependencies]
# Only the pure halves (interp, pose, protocol, types): the oracle dump records the vendored
# interpolator, and the relay mapping rows build the crate's own events. No libcolyseus is linked.
genex-multiplayer = { workspace = true }
