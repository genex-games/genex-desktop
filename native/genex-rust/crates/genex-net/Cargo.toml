[package]
name = "genex-net"
description = "Multiplayer for genex games: the network as an input stream (one NetFrame per tick, a journal, a queued write set) over Off, Loopback, Relay and Replay backends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

# Backends are chosen by the build, never by game code. `relay` will link the vendored
# genex-multiplayer client (native libcolyseus or the web bridge) for exports and the web draft;
# `loopback` marks Live, dev, judge and device builds. Both are empty until their work packages
# (MP-2b, MP-3a) fill them, so no build links any network code yet.
[features]
default = []
relay = []
loopback = []

[dependencies]
# `Map`/`Set` live below the facade, so this crate shares them with a game; glam carries the
# protocol's flat pose, serde_json the JSON states and libm the sim-time interpolator.
genex-core = { workspace = true }
glam = { workspace = true }
serde_json = { workspace = true }
libm = { workspace = true }
