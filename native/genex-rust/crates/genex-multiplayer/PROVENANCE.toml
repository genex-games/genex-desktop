# Where this crate comes from. genex-multiplayer (MIT, first party) is the Genex relay protocol 3
# client, vendored byte for byte from the genex-demo monorepo: no fork, fixes go upstream first and
# arrive here as a new pin. `tests/conformance/rust-vendored-multiplayer.test.ts` holds this
# folder to the table below: every listed file present with its sha256 and size, nothing added,
# nothing missing, no link. With the rewrites undone and the local files left out, the folder
# hashes to the upstream git tree.
#
# Refreshing the pin: `git archive <commit>:sdks/rust/genex-multiplayer` into this folder, apply
# the rewrites again, then rewrite this file (commit, tree and every row).

schema = 1
upstream = "genex-demo"
path = "sdks/rust/genex-multiplayer"
commit = "8cd1477a2a120937a1c79fc1c98b99cef3fcc145"
tree = "d25b243dbf124e33d8fcfa56fe133a1bdd7a337e"
licence = "MIT"

# The upstream manifest inherits its edition from the genex-demo workspace (2021). This workspace
# is on edition 2024, where the crate's `extern "C"` blocks and `std::env::remove_var` call no
# longer compile, so the manifest names the upstream edition itself. Every other inherited key
# (rust-version, licence, repository) resolves acceptably from this workspace.
[[rewrite]]
file = "Cargo.toml"
upstream = 'edition.workspace = true'
vendored = 'edition = "2021"'
upstream_sha256 = "2fa7475d031b44c2473d063a92786dd57349d02ea8398347f2f16794abeb589f"

# The one file this repository adds: the crate's own clippy rules, replacing the workspace's game
# rules (it reads wall clocks and keys views in HashMaps, as host network code may).
[[file]]
path = "clippy.toml"
