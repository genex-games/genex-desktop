[package]
name = "genex-crash"
description = "Crash reports for genex games: typed crash records with raw frames and context, the panic hook, a capped file sink and replay of the ticks before a crash."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# genex-core for the save root the file sink writes under (and its reserved crash folder);
# serde and serde_json for the record's JSON; thiserror for the refusal enums. All already locked.
genex-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# backtrace for the raw instruction pointers of a panic's stack (`trace` only: the host
# symbolicates); never on wasm32, where the web shell keeps the engine's stack.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
backtrace = { workspace = true }
