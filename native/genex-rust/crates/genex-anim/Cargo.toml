[package]
name = "genex-anim"
description = "Skeletal animation for genex games: rigs, clips, blending, state machines, blend spaces, root motion, IK, retargeting, characters and ragdolls."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

# Rapier 3D for the parts that need a physics world. The facade's own `physics` feature turns it on,
# so a game built without physics links no Rapier through this crate either.
[features]
default = []
physics = ["dep:rapier3d"]

[dependencies]
# `Map`/`Set`, `CellId` and `GameRng` live below the facade so this crate shares them with a game.
genex-core = { workspace = true }
glam = { workspace = true }
# The rig importer (AN-1) reads GLBs with the same pinned parser genex-render and genex-assets use.
gltf = { workspace = true }
rapier3d = { workspace = true, optional = true }
# Blend spaces (AN-8) triangulate cartesian points with spade's robust Delaunay; parry3d (Rapier)
# already brings the same version into the lock.
spade = { workspace = true }
