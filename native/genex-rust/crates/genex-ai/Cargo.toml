# Play-time AI for a Rust game (docs/play-protocol.md, "Play-time AI"; the crate name is reserved
# there): typed asks, the closed schema dialect and the `ai` lines a game prints to the studio.
# It speaks only to the studio, never to a model vendor: no network crate is in its graph
# (tests/graph.rs holds that). Dependencies come from [workspace.dependencies] only.
[package]
name = "genex-ai"
description = "Play-time AI for genex games: ask, say, judge and act over the studio's ai lines, results only through drain(), the closed schema dialect and #[derive(Schema)]."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
genex-ai-derive = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The shared fixture holds doubles JavaScript printed; reading them back exactly takes serde_json's
# correctly rounded parser (tests only: the runtime's own parsing is left as the workspace has it).
serde_json = { workspace = true, features = ["float_roundtrip"] }
