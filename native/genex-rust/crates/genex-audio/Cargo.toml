# Stub member written by M0a.1 so later work packages never edit the workspace manifest.
# Filled by M0a.5, M2.7 and the G6 audio work packages (AU-0..AU-5). Dependencies come from
# [workspace.dependencies] only.
[package]
name = "genex-audio"
description = "kira mixer with a device-less backend for headless and boxed runs; symphonia decoding."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

# The mixer, the device output and the decoders (kira, cpal, symphonia). Without it the crate is
# its logical side only: the Director, the vocabulary, the meter and the sink queue, which a game
# built with `[audio] enabled = false` still names (the facade's `audio` feature turns it on, AU-11).
[features]
default = ["mixer"]
mixer = ["dep:kira", "dep:cpal", "dep:symphonia"]

[dependencies]
genex-core = { workspace = true }
kira = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
symphonia = { workspace = true, optional = true }
libm = { workspace = true }
glam = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
