# Stub member written by M0a.1 so later work packages never edit the workspace manifest.
# Filled by M0a.7 (shell exports, async capture, frame bridge, self-test record) and M2.9 (the
# deferred start behind the IndexedDB saves mirror, the saves sample).
# Dependencies come from [workspace.dependencies] only.
[package]
name = "genex-platform-web"
description = "Web shell on WebGPU only (the designed unsupported page otherwise), async capture, IndexedDB saves mirror."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

# The frame bridge and the self-test record are plain Rust and build (and are tested) on every
# target; only the `web` module, the wasm-bindgen exports the shell calls, is wasm32-only.
# A web game links Rapier unless its genex.toml turns physics off (the host writes the facade line
# without default features then).
[features]
default = ["physics", "physics-raw", "audio", "nav", "streaming", "animation"]
physics = ["genex/physics"]
# Raw Rapier beside Genex Physics (deprecated, one release): the facade feature of the same name.
physics-raw = ["genex/physics-raw"]
# A web game links the mixer and decoders unless its genex.toml turns audio off (AU-11).
audio = ["genex/audio"]
# The game systems a genex.toml switches off (`[nav]`, `[streaming]`, `[animation]`, release R-1):
# each is the facade feature of the same name.
nav = ["genex/nav"]
streaming = ["genex/streaming"]
animation = ["genex/animation"]
# Multiplayer (G6 MP-5b): the host writes a `[net]` game's web line with one of these, as it writes
# the native facade's: the in-process room for Live, the relay (the page's JS bridge) for an export.
net = ["genex/net"]
net-loopback = ["genex/net-loopback"]

[dependencies]
genex = { workspace = true }
genex-core = { workspace = true }
genex-render = { workspace = true }
# The studio verbs `window.__studio` answers through (`Studio::web()`: the shared ops only, never
# the fd-3 transport, which a wasm32 build cannot open).
genex-studio = { workspace = true }
# The HUD's painter (the web paints it over the world target as the native presenter does).
genex-hud = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# The crash hook the page's panics go through (game systems CRASH-3): one `genex-crash/1` record to
# the shell's IndexedDB, then the console text console_error_panic_hook logged (`src/crash.rs`).
genex-crash = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

# The saves sample `tests/conformance/rust-web.test.ts` packages for the browser (empty off wasm32).
[[example]]
name = "web_saves"
crate-type = ["cdylib"]

# The crash sample `tests/conformance/rust-web-crash.test.ts` packages for the browser: a panic and a
# trap with no panic, on a key each (empty off wasm32).
[[example]]
name = "web_crash"
crate-type = ["cdylib"]

# The streaming sample `tests/conformance/rust-web-streamed-world.test.ts` packages for the browser:
# a streamed world whose far cell arrives after a teleport, and a named group (empty off wasm32).
[[example]]
name = "web_stream"
crate-type = ["cdylib"]
