# genex-physics-capi is host code, not a simulation: the lane's game rules (../../clippy.toml,
# M0a.9) do not bind it, and this file replaces them for this crate. A tick reads the wall clock
# (`Instant`) only to time its step for `stats().stepMs` (§11.4), which no hash or result includes.
disallowed-types = [
  { path = "std::collections::HashMap", reason = "iteration order differs per process: use an ordered Vec or BTreeMap" },
  { path = "std::collections::HashSet", reason = "iteration order differs per process: use an ordered Vec or BTreeSet" },
]
