[package]
name = "genex-ui"
description = "Gameplay UI for genex games: focus and keyed widgets, controller navigation, the widget kit, localized text and the settings menu."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Each work package adds the dependencies it uses from [workspace.dependencies] (all locked).
# genex-core for the pad state navigation reads (UIS-4); egui for every widget (UIS-4, UIS-5);
# image decodes the kit's PNG images once per path (UIS-5).
genex-core = { workspace = true }
egui = { workspace = true }
image = { workspace = true }
# fluent-bundle and unic-langid for the text catalogs and locales (UIS-6).
fluent-bundle = { workspace = true }
unic-langid = { workspace = true }

[dev-dependencies]
# The tests lay out text, so their contexts get the HUD's text fonts (egui is built without its
# default fonts).
epaint_default_fonts = { workspace = true }
