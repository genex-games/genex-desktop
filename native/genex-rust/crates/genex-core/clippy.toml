# genex-core is the deterministic core every destination replays bit for bit: nothing in it may
# iterate in a per-process random order or read a wall clock (M0a.2 acceptance).
disallowed-types = [
  { path = "std::collections::HashMap", reason = "iteration order differs per process; use BTreeMap or an ordered Vec" },
  { path = "std::collections::HashSet", reason = "iteration order differs per process; use BTreeSet or a sorted Vec" },
  { path = "std::time::Instant", reason = "the core never reads a wall clock; time comes in as frame milliseconds" },
  { path = "std::time::SystemTime", reason = "the core never reads a wall clock; time comes in as frame milliseconds" },
]

# The workspace root's determinism methods (f32 transcendentals, threads, per-process randomness)
# bind genex-core too, plus the f64 forms the core could reach for: this file shadows the root
# one, so it carries the whole list (M0a review). The audio meter's FFT is the one reasoned
# `#[allow]` (a volatile reading, never in the checksum).
disallowed-methods = [
  { path = "f64::sin", reason = "platform libm: the core's replayed state takes no f64 transcendental (an allow names the volatile exception)" },
  { path = "f64::cos", reason = "platform libm: the core's replayed state takes no f64 transcendental (an allow names the volatile exception)" },
  { path = "f64::sin_cos", reason = "platform libm: the core's replayed state takes no f64 transcendental" },
  { path = "f64::tan", reason = "platform libm: the core's replayed state takes no f64 transcendental" },
  { path = "f64::atan2", reason = "platform libm: the core's replayed state takes no f64 transcendental" },
  { path = "f64::exp", reason = "platform libm: the core's replayed state takes no f64 transcendental" },
  { path = "f64::ln", reason = "platform libm: the core's replayed state takes no f64 transcendental" },
  { path = "f64::powf", reason = "platform libm: the core's replayed state takes no f64 transcendental" },
  { path = "f64::powi", reason = "unspecified precision per target" },
  { path = "f64::hypot", reason = "platform libm: the core's replayed state takes no f64 transcendental (an allow names the volatile exception)" },
  { path = "f32::sin", reason = "platform libm: use genex::math::sin" },
  { path = "f32::cos", reason = "platform libm: use genex::math::cos" },
  { path = "f32::sin_cos", reason = "platform libm: use genex::math::sin_cos" },
  { path = "f32::tan", reason = "platform libm: use genex::math::tan" },
  { path = "f32::asin", reason = "platform libm: use genex::math::asin" },
  { path = "f32::acos", reason = "platform libm: use genex::math::acos" },
  { path = "f32::atan", reason = "platform libm: use genex::math::atan" },
  { path = "f32::atan2", reason = "platform libm: use genex::math::atan2" },
  { path = "f32::sinh", reason = "platform libm: use genex::math::sinh" },
  { path = "f32::cosh", reason = "platform libm: use genex::math::cosh" },
  { path = "f32::tanh", reason = "platform libm: use genex::math::tanh" },
  { path = "f32::asinh", reason = "platform libm: use genex::math::asinh" },
  { path = "f32::acosh", reason = "platform libm: use genex::math::acosh" },
  { path = "f32::atanh", reason = "platform libm: use genex::math::atanh" },
  { path = "f32::exp", reason = "platform libm: use genex::math::exp" },
  { path = "f32::exp2", reason = "platform libm: use genex::math::exp2" },
  { path = "f32::exp_m1", reason = "platform libm: use genex::math::exp_m1" },
  { path = "f32::ln", reason = "platform libm: use genex::math::ln" },
  { path = "f32::log", reason = "platform libm: use genex::math::ln" },
  { path = "f32::log2", reason = "platform libm: use genex::math::log2" },
  { path = "f32::log10", reason = "platform libm: use genex::math::log10" },
  { path = "f32::ln_1p", reason = "platform libm: use genex::math::ln_1p" },
  { path = "f32::powf", reason = "platform libm: use genex::math::pow" },
  { path = "f32::powi", reason = "unspecified precision per target: multiply, or use genex::math::pow" },
  { path = "f32::cbrt", reason = "platform libm: use genex::math::cbrt" },
  { path = "f32::hypot", reason = "platform libm: use genex::math::hypot" },
  { path = "std::thread::spawn", reason = "a simulation runs on one thread: threads reorder its work" },
  { path = "rand::thread_rng", reason = "seeded per process: use ctx.rng", allow-invalid = true },
  { path = "rand::rng", reason = "seeded per process: use ctx.rng", allow-invalid = true },
  { path = "rand::random", reason = "seeded per process: use ctx.rng", allow-invalid = true },
  { path = "getrandom::getrandom", reason = "operating-system entropy: use ctx.rng", allow-invalid = true },
  { path = "getrandom::fill", reason = "operating-system entropy: use ctx.rng", allow-invalid = true },
  { path = "fastrand::Rng::new", reason = "seeded per process: use fastrand::Rng::with_seed from ctx.rng", allow-invalid = true },
  { path = "fastrand::u32", reason = "the global generator is seeded per process: use ctx.rng", allow-invalid = true },
  { path = "fastrand::u64", reason = "the global generator is seeded per process: use ctx.rng", allow-invalid = true },
  { path = "fastrand::usize", reason = "the global generator is seeded per process: use ctx.rng", allow-invalid = true },
  { path = "fastrand::i32", reason = "the global generator is seeded per process: use ctx.rng", allow-invalid = true },
  { path = "fastrand::f32", reason = "the global generator is seeded per process: use ctx.rng", allow-invalid = true },
  { path = "fastrand::f64", reason = "the global generator is seeded per process: use ctx.rng", allow-invalid = true },
  { path = "fastrand::bool", reason = "the global generator is seeded per process: use ctx.rng", allow-invalid = true },
  { path = "fastrand::shuffle", reason = "the global generator is seeded per process: use ctx.rng", allow-invalid = true },
  { path = "fastrand::choice", reason = "the global generator is seeded per process: use ctx.rng", allow-invalid = true },
]
