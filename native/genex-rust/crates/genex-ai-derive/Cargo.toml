# `#[derive(genex_ai::Schema)]`: a Rust type as the closed schema dialect a play-time AI answer
# is held to. Re-exported by genex-ai; a game never names this crate. Dependencies come from
# [workspace.dependencies] only.
[package]
name = "genex-ai-derive"
description = "The derive behind genex_ai::Schema: a struct or enum as genex's closed JSON-schema dialect, kept in step with its serde attributes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
