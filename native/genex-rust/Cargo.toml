# The genex runtime workspace (M0a spike; M1.12 lands it on dev). The host owns this manifest and
# its lock: games never carry a Cargo.toml, and crate work packages add dependencies only from
# `[workspace.dependencies]` below (each pinned to the version `vendor-allowlist.toml` vendored).
#
# Every cargo command runs through the env helper, offline, against the vendored tree:
#   bash scripts/spike/rust-wgpu/rust-env.sh cargo test -p genex --offline --locked
#
# Determinism (plan "The game API agents write"): Rapier's `enhanced-determinism` turns on
# `glamx/scalar-math` and `glamx/libm`, so by feature unification every glam 0.33 user in this
# lock runs scalar libm math and glam's Vec4/Quat/Mat4 lose `repr(align(16))`. GPU-facing structs
# therefore never use glam types: they are `#[repr(C)]` structs of explicit `[f32; N]` arrays with
# bytemuck and hand padding (README.md, "Renderer rule").

[workspace]
resolver = "3"
members = [
  "crates/genex",
  "crates/genex-core",
  "crates/genex-studio",
  "crates/genex-render",
  "crates/genex-hud",
  "crates/genex-frames",
  "crates/genex-gpu-memory",
  "crates/genex-assets",
  "crates/genex-audio",
  # Game systems (EP-0a1): animation, navigation and world streaming, below the facade.
  "crates/genex-anim",
  "crates/genex-nav",
  "crates/genex-stream",
  # Multiplayer (MP-0): the net input stream below the facade, and the vendored relay client it
  # drives (MP-1a: its build script links the store's pinned libcolyseus, never a download).
  "crates/genex-net",
  "crates/genex-multiplayer",
  # G6 core game systems (INT-prep): input, saves, gameplay UI, profiling and crash reports.
  "crates/genex-input",
  "crates/genex-save",
  "crates/genex-ui",
  "crates/genex-profile",
  "crates/genex-crash",
  "crates/genex-platform-desktop",
  "crates/genex-platform-web",
  "crates/genex-platform-ios",
  "crates/genex-platform-android",
  # Every example game is a member (the pond, and M2.19's `custom-pass`): an example folder holds
  # its own Cargo.toml, so a new one needs no edit here, only its lock lines.
  "examples/*",
]
default-members = ["crates/genex"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false
repository = "https://github.com/genex-games/genex-desktop"

[workspace.lints.rust]
# Game code is compiled with `-F unsafe_code` by the lane; runtime crates that need FFI (frames,
# the iOS and Android shells) allow it in their own lib.rs with the reason next to it.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"

[workspace.dependencies]
# Workspace crates.
# Without its default `physics` feature: each member names it (the web facade forwards it), so a
# game that opts out of physics links no Rapier anywhere in the graph.
genex = { path = "crates/genex", version = "0.1.0", default-features = false }
genex-core = { path = "crates/genex-core", version = "0.1.0" }
genex-studio = { path = "crates/genex-studio", version = "0.1.0" }
genex-render = { path = "crates/genex-render", version = "0.1.0" }
genex-hud = { path = "crates/genex-hud", version = "0.1.0" }
genex-frames = { path = "crates/genex-frames", version = "0.1.0" }
genex-gpu-memory = { path = "crates/genex-gpu-memory", version = "0.1.0" }
genex-assets = { path = "crates/genex-assets", version = "0.1.0" }
genex-audio = { path = "crates/genex-audio", version = "0.1.0" }
# Each without Rapier: the facade's `physics` feature turns theirs on.
genex-anim = { path = "crates/genex-anim", version = "0.1.0" }
genex-nav = { path = "crates/genex-nav", version = "0.1.0" }
genex-stream = { path = "crates/genex-stream", version = "0.1.0" }
genex-net = { path = "crates/genex-net", version = "0.1.0" }
# Without `native`: genex-net's `relay` feature turns it on, so only export builds of a `[net]` game
# link libcolyseus (MP-3a); the pure halves (interp, pose, protocol, types) serve its tests.
genex-multiplayer = { path = "crates/genex-multiplayer", version = "0.1.0", default-features = false }
# G6: the facade takes each only in its area's facade work package (EXT-PLAN M5).
genex-input = { path = "crates/genex-input", version = "0.1.0" }
genex-save = { path = "crates/genex-save", version = "0.1.0" }
genex-ui = { path = "crates/genex-ui", version = "0.1.0" }
genex-profile = { path = "crates/genex-profile", version = "0.1.0" }
genex-crash = { path = "crates/genex-crash", version = "0.1.0" }
genex-platform-desktop = { path = "crates/genex-platform-desktop", version = "0.1.0" }
# Without its default `physics` too: the phone shells reach the facade through it and must not turn
# Rapier on for a game that turned it off (a web game's manifest names the crate itself).
genex-platform-web = { path = "crates/genex-platform-web", version = "0.1.0", default-features = false }
genex-platform-ios = { path = "crates/genex-platform-ios", version = "0.1.0" }
genex-platform-android = { path = "crates/genex-platform-android", version = "0.1.0" }

# Renderer: WebGPU-core backends only, never a GL feature (the vendored-set gate refuses glow).
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "webgpu", "wgsl", "fragile-send-sync-non-atomic-wasm"] }
naga = { version = "=30.0.1", features = ["wgsl-in"] }
bytemuck = { version = "1.25", features = ["derive"] }
# glam 0.33.x only (kira and glamx need ^0.33); scalar-math + libm named here too, so the facade
# keeps libm math even in a crate graph without Rapier.
glam = { version = "0.33.12", features = ["scalar-math", "libm", "bytemuck", "mint", "serde"] }

# Window, input, HUD.
winit = { version = "=0.30.13" }
raw-window-handle = "0.6.2"
# No `default_fonts`: egui's two emoji fonts were 457 KB of every web build's gzip; genex-hud installs
# the text fonts alone from epaint_default_fonts (renderer pass 2, owner decision D11).
egui = { version = "=0.36.2", default-features = false, features = ["bytemuck"] }
epaint_default_fonts = { version = "=0.36.2" }
# Only the painter (`egui_wgpu::Renderer`): its `winit` feature would pull winit, and so
# android-activity with no activity chosen, into every phone build of the facade.
egui-wgpu = { version = "=0.36.2", default-features = false, features = ["macos-window-resize-jitter-fix", "fragile-send-sync-non-atomic-wasm"] }
egui-winit = { version = "=0.36.2", default-features = false, features = ["bytemuck", "clipboard", "wayland", "x11"] }
gilrs = "0.11.2"
pollster = "0.4.0"

# Physics.
rapier3d = { version = "=0.36.0", features = ["enhanced-determinism", "serde-serialize"] }

# Audio (symphonia 0.6 is kira's own copy; one in the lock).
kira = { version = "=0.12.5", default-features = false, features = ["cpal", "mp3", "ogg", "vorbis", "flac", "wav", "pcm"] }
cpal = { version = "0.18.2" }
symphonia = { version = "=0.6.1", default-features = false }

# Assets.
gltf = { version = "=1.4.1", features = ["import", "utils", "names", "extras", "extensions", "KHR_lights_punctual", "KHR_materials_emissive_strength", "KHR_materials_unlit", "KHR_texture_transform"] }
# KTX2 container reader (renderer pass 2, A6.4): Apache-2.0 only; levels are never
# supercompressed (the export step writes them plain), so no zstd decoder.
ktx2 = { version = "=0.5.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "hdr", "exr", "dds", "gif", "bmp", "qoi"] }
# The PNG decoder image uses, on its own for the UI kit (genex-ui): one copy in the lock.
png = { version = "0.18.1" }

# Core, protocol, saves. serde_json keeps object members in insertion order, as the C++ json.h
# does, so probes merge in registration order and the checksum dump is order-stable.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
postcard = { version = "1.1.3", features = ["alloc"] }
indexmap = { version = "2.14.2", features = ["serde"] }
libm = "0.2.16"
log = "0.4.34"
thiserror = "2.0.21"
toml = "1.1.6"

# macOS / iOS.
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-metal = "=0.3.2"
objc2-io-surface = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-ui-kit = "0.3.2"
block2 = "0.6.2"
mach2 = "0.4.3"

# Windows: the studio pipe is opened overlapped (std has no overlapped I/O). The version is the
# one the lock already resolves for winit/wgpu.
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }
# Unix test doubles only (std has no signal API).
libc = "=0.2.190"

# Web.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = ["Window", "Document", "HtmlCanvasElement", "Navigator", "Gpu", "Storage", "console", "Performance"] }
console_error_panic_hook = "0.1.7"

# Android (GameActivity pinned to android-activity 0.6.1; M0a.16 picks the activity).
android-activity = { version = "=0.6.1" }
ndk = "0.9.0"
ndk-context = "0.1.1"
jni = "0.21.1"
android_logger = "0.15.1"

# Game systems: the mesh arena's allocator (renderer), the runtime MikkTSpace tangent fallback and
# genex-anim's Delaunay triangulation. Unused until the work packages that adopt them, so the lock
# does not name them yet.
offset-allocator = "=0.2.0"
bevy_mikktspace = "=1.0.0"
spade = "2.15.1"

# G6 game systems (one dependency commit, owner call OX-3), unused until the work packages that
# adopt them. Profiling (P6): puffin without serialization (no bincode, lz4 or zstd), its `web`
# clock on wasm32; `profiling/profile-with-puffin` and rapier's `profiler` are dev-flavour features
# the facade turns on (PROF-5). Crash reports (P6): backtrace's raw instruction pointers, never on
# wasm32 or iOS (genex-crash/Cargo.toml says why); object and addr2line, the versions backtrace brings, for the host's symbolicate tool.
puffin = { version = "=0.20.0", default-features = false }
profiling = { version = "1.0.18" }
backtrace = { version = "=0.3.76" }
object = { version = "0.37.3", default-features = false, features = ["read", "std"] }
addr2line = { version = "0.25.1", default-features = false, features = ["std"] }
# Gameplay UI and saves (U5): Fluent catalogs and locales, the OS locale for the native shells,
# and deflate for large saves (already in the lock through png; named as a direct dependency).
fluent-bundle = { version = "0.16.0" }
unic-langid = { version = "0.9.6" }
sys-locale = { version = "=0.3.2" }
miniz_oxide = { version = "=0.8.9" }

# The initial game allowlist (plan "Agent policy"): `fastrand` seeded from ctx.rng only, and
# `pathfinding` (generic graph search over a game's own graphs).
noise = "0.9.0"
fastrand = "2.5.0"
pathfinding = "4.16.0"

# Tests.
trybuild = "1.0.121"
wasm-bindgen-test = "0.3.79"

# Engine dev and test builds keep file and line tables only: three checkouts share one target, and full
# debug info filled the disk between waves. Backtraces still name file and line.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.release]
codegen-units = 1
lto = "thin"
