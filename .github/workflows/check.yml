name: Check
# Three jobs. `gate` (Linux, a few cents) runs on every PR and push: architecture, typecheck, lint
# test style, baseline contracts, affected behavior tests and, when a change reaches it, the
# harness gate (npm run verify:harness). `fast` (macOS) runs non-rig tests,
# only where paid runners belong: PRs into main (dev -> main is opened by hand), pushes to main
# and manual runs. An opt-in manual `full` runs npm run verify, including rigs and Electron
# fixtures. A skipped job bills nothing. The labelled rig gate also runs from rig.yml. This workflow
# never listens to label events, so a label can never replace a code-event run with a skipped one.
# No secrets; pull_request runs with the fork's read-only token.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Fork feature pushes can produce reviewable checks before upstream approves fork PR runs.
  # The gate below preserves upstream's dev/main push policy.
  push:
  workflow_dispatch:
    inputs:
      fast:
        description: Also run the macOS fast suite (disable for a Linux-only fork check)
        type: boolean
        default: true
      base:
        description: Exact comparison commit for a manual run (defaults to the previous commit)
        required: false
        default: ""
      full:
        description: Also run full fixture regression on macOS (npm run verify; billed runner)
        type: boolean
        default: false
      full_mode:
        description: All stages, or resume Electron acceptance after a recorded Node/rig pass
        type: choice
        options: [all, acceptance]
        default: all
permissions:
  contents: read
concurrency:
  # Routine fork pushes and manual gates must not cancel an explicitly requested full regression.
  group: check-${{ github.event_name == 'workflow_dispatch' && (inputs.full && 'full-' || 'manual-') || (github.event.repository.fork && github.event_name == 'push' && 'fork-push-' || '') }}${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    if: >-
      github.event_name != 'push' || github.ref == 'refs/heads/dev' ||
      github.ref == 'refs/heads/main' || github.event.repository.fork
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # origin/dev lets check-test-style refuse allowlist additions against the merge base.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      # Fast behavior tests use synthetic runtimes; no Electron download or native rebuild.
      - name: Linux process sandbox prerequisites
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
      - run: npm ci --ignore-scripts
      # --ignore-scripts skips postinstall, which patches sandbox-runtime's executable lookup.
      - name: Patch the sandbox runtime as postinstall does
        run: node --input-type=module -e "await (await import('./scripts/patch-sandbox-runtime.mjs')).patchSandboxRuntime()"
      - run: npm run verify:architecture
      - run: npm run typecheck
      - run: npm run lint
      - run: node scripts/check-test-style.ts
      - name: Shared vocabulary contracts
        run: node scripts/check-vocabulary.ts
      # Public cases only; `--with-holdouts` is for the owner's machine and never runs in CI.
      - name: Eval case isolation
        run: node scripts/evals/check-isolation.ts
      - name: Baseline behavior contracts
        run: node scripts/test.mjs tests/conformance/seed-upgrade.test.ts tests/conformance/child-env.test.ts tests/conformance/words.test.ts tests/conformance/check-grammar.test.ts
      - name: Change base
        env:
          STUDIO_TEST_BASE: ${{ github.event.pull_request.base.sha || inputs.base || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
        run: |
          if [ -n "$STUDIO_TEST_BASE" ] && ! git cat-file -e "$STUDIO_TEST_BASE^{commit}" 2>/dev/null; then
            # A fork may not contain the latest upstream commit. Never silently replace an
            # explicit comparison base with HEAD^ and report an incomplete affected gate.
            git fetch --no-tags origin "$STUDIO_TEST_BASE"
            git cat-file -e "$STUDIO_TEST_BASE^{commit}"
          fi
          if [ -z "$STUDIO_TEST_BASE" ]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              STUDIO_TEST_BASE=$(git rev-parse HEAD^)
            else
              STUDIO_TEST_BASE=$(git hash-object -t tree /dev/null)
            fi
          fi
          echo "STUDIO_TEST_BASE=$STUDIO_TEST_BASE" >> "$GITHUB_ENV"
      - name: Changed script syntax
        run: node scripts/affected-tests.mjs --check-syntax --base "$STUDIO_TEST_BASE"
      - name: Affected behavior tests
        run: node scripts/affected-tests.mjs --tier L1 --run --base "$STUDIO_TEST_BASE"
      # The harness's own behavior (harness-incidents and the scoreboard) before a loop or seed
      # change merges. They boot the rig, so the selector files them under L3; run them here only
      # when the change reaches them.
      - name: Harness behavior gate
        run: |
          if node scripts/affected-tests.mjs --tier L3 --json --base "$STUDIO_TEST_BASE" | node scripts/harness-gate-selected.mjs; then
            npm run verify:harness
          else
            echo "No change reaches the harness gate."
          fi
  full:
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Native plugin fixture contracts
        if: inputs.full_mode != 'acceptance'
        run: node scripts/test.mjs tests/conformance/blender.test.ts tests/conformance/unity-plugin.test.ts
      - name: Full fixture regression, rigs, build and Electron acceptance
        if: inputs.full_mode != 'acceptance'
        run: npm run verify
      # This continuation reports only acceptance. It never substitutes for a Node/rig pass;
      # callers must link the prior run and show that its tested inputs remain unchanged.
      - name: Resume build and Electron acceptance (Node/rig suite not run)
        if: inputs.full_mode == 'acceptance'
        run: |
          npm run build
          node tests/e2e/run-electron-e2e.mjs
          node tests/e2e/run-build-smoke.mjs
          node tests/e2e/run-shapes-e2e.mjs
          npm run test:agentic-readiness
  fast:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.fast) ||
      (github.event_name != 'workflow_dispatch' &&
       (github.base_ref == 'main' || github.ref == 'refs/heads/main'))
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # origin/dev lets check-test-style refuse allowlist additions against the merge base.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:architecture
      - run: npm run typecheck
      - run: npm run lint
      - run: node scripts/check-test-style.ts
      - run: node scripts/test.mjs --group fast
