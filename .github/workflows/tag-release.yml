name: Tag release
# A version bump merged into main tags itself v<version> and starts its release. A version that
# already has its tag is left alone, so every other push to main does nothing. A tag the workflow
# token creates starts no workflow, so scripts/tag-release.mjs dispatches release.yml on the tag.
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: write
concurrency:
  group: tag-release
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Tag a new version and start its release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/tag-release.mjs
