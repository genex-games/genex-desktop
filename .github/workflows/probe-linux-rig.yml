name: Probe rig on Linux
# Temporary: measures whether the rig regression passes on Linux runners. Removed before merge.
on:
  push:
    branches: [claude/speed-up-release-ci-ug04gq]
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      rig_matrix: ${{ steps.plan.outputs.rig_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - id: plan
        run: node scripts/ci-test-plan.mjs plan --full --output .studio-dev/ci/plan.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: probe-plan
          path: .studio-dev/ci/plan.json
          include-hidden-files: true
  rig:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.rig_matrix) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
      - run: npm ci --ignore-scripts
      - run: node --input-type=module -e "await (await import('./scripts/patch-sandbox-runtime.mjs')).patchSandboxRuntime()"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: probe-plan
          path: .studio-dev/ci
      - env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/ci-test-plan.mjs run --plan .studio-dev/ci/plan.json --group rig --shard "$SHARD"
