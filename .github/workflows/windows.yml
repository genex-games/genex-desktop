name: Windows
# The Windows port's gate (plan phase 3, W4), on PRs into main (dev -> main is opened by hand) and
# on demand; PRs into dev skip these billed minutes. Required: install, typecheck, lint, the one-time
# sandbox setup and the curated suite in tests/windows-suite.json. A dispatch with `backlog` also
# runs the rest of the fast group as an informational pass (it lists the failing files and never
# fails the job); one with `files` runs just those test files after the sandbox setup, and one with
# `desktop` only drives computer control. Unless it names files, it drives computer control on the
# runner's desktop. The hosted
# runner is elevated and disposable, so the sandbox install needs no UAC prompt. No secrets;
# pull_request runs with the fork's read-only token.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      files:
        description: Test files to run instead of the gate (space-separated); skips typecheck, lint and both passes
        required: false
        default: ""
      backlog:
        description: Also run the rest of the fast group (the informational pass, about 20 minutes)
        type: boolean
        default: false
      desktop:
        description: Only drive computer control on the desktop; skips typecheck, lint and the tests
        type: boolean
        default: false
      grok:
        description: Install the real Grok Build CLI first, for its opt-in tests (name them in files)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: ${{ !inputs.files && !inputs.desktop }}
        run: npm run typecheck
      - if: ${{ !inputs.files && !inputs.desktop }}
        run: npm run lint
      - name: Windows sandbox setup (srt-sandbox user and WFP filters)
        run: node scripts/ci-windows-sandbox.mjs
      # Grok Build from xAI's own installer, for STUDIO_GROK_CLI_TESTS. It installs into the
      # profile (`~/.grok/bin`), which the sandbox user cannot read, so the tests run a copy beside
      # the runner's temporary files.
      - name: Grok Build
        if: ${{ inputs.grok }}
        shell: pwsh
        run: |
          irm https://x.ai/cli/install.ps1 | iex
          $bin = Join-Path $env:RUNNER_TEMP "grok-bin"
          Copy-Item -Recurse (Join-Path $env:USERPROFILE ".grok\bin") $bin
          Get-ChildItem $bin | Format-Table Name, Length
          & (Join-Path $bin "grok.exe") --version
          "STUDIO_GROK_BIN=$(Join-Path $bin 'grok.exe')" >> $env:GITHUB_ENV
          "STUDIO_GROK_CLI_TESTS=1" >> $env:GITHUB_ENV
          # Diagnostics (temporary): a made-up sign-in, and what Grok does to its file's permissions.
          $diag = Join-Path $env:RUNNER_TEMP "grok-diag"
          New-Item -ItemType Directory -Force $diag | Out-Null
          Set-Content (Join-Path $diag "token.mjs") 'console.log(JSON.stringify({ access_token: "fake-session-token", expires_in: 3600 }));'
          $env:GROK_HOME = Join-Path $diag "home"
          $env:GROK_AUTH_PROVIDER_COMMAND = "`"$((Get-Command node).Source)`" `"$(Join-Path $diag 'token.mjs')`""
          $env:GROK_DISABLE_AUTOUPDATER = "1"
          & (Join-Path $bin "grok.exe") login
          Get-ChildItem $env:GROK_HOME | Format-Table Name, Length
          $auth = Join-Path $env:GROK_HOME "auth.json"
          icacls $env:GROK_HOME
          icacls $auth
          "protected: $((Get-Acl $auth).AreAccessRulesProtected)"
          $store = Get-Content $auth -Raw | ConvertFrom-Json
          foreach ($scope in $store.PSObject.Properties) { "scope $($scope.Name): $(($scope.Value.PSObject.Properties | ForEach-Object Name) -join ', ')" }
      - name: Tests
        if: ${{ !inputs.desktop }}
        env:
          FILES: ${{ inputs.files }}
          BACKLOG: ${{ inputs.backlog }}
        run: |
          # Windows minutes are billed: a dispatch can name files (a probe, a fix's own tests), and
          # the informational pass runs only when asked for.
          if [ -n "$FILES" ]; then node --test --test-reporter=tap --test-concurrency=1 --test-timeout=300000 --test-force-exit $FILES
          elif [ "$BACKLOG" = true ]; then npm run test:windows
          else npm run test:windows -- --suite-only; fi
      # Computer control on the runner's own desktop: the bundled driver embedded on its named pipe,
      # driven through the desktop tool by a scripted agent (Notepad, the refusals, the stop, no
      # driver left behind).
      - name: Computer control on the desktop
        if: ${{ !cancelled() && !inputs.files }}
        run: node tests/e2e/run-windows-desktop-control.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-tests
          path: |
            .studio-dev/evidence/windows-tests
            .studio-dev/evidence/windows-desktop-control
          if-no-files-found: ignore
