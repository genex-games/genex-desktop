name: Package
# Unsigned packages on PRs into main and pushes to main (dev -> main is opened by hand; PRs into
# dev skip this billed matrix): the same makers the release uses (dmg and zip on macOS; deb, rpm
# and zip on Linux; the Squirrel installer on Windows), then the packaged smoke and the packaged
# terminal against the result (on macOS and Linux the packaged smoke also launches the Rust · wgpu
# payload acceptance: template, lock line, no cargo or rustc, the release gate). No secrets: the
# macOS build is ad-hoc signed and the Windows build unsigned. Signed builds come from release.yml.
# A dispatch with `only` builds one platform; one with `test_sign` has SignPath sign the Windows
# build with its self-signed test certificate (.github/actions/windows-signpath), the only use of a
# secret here.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      only:
        description: One platform to package (darwin, linux or win32); empty for all three
        required: false
        default: ""
      test_sign:
        description: Sign the Windows build through SignPath with its test certificate
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      # Every platform, or the one a dispatch names (billed minutes: macOS costs five times Windows).
      matrix:
        include: >-
          ${{ fromJSON(
            inputs.only == 'darwin' && '[{"os":"macos-26","platform":"darwin","arch":"arm64"}]' ||
            inputs.only == 'linux' && '[{"os":"ubuntu-22.04","platform":"linux","arch":"x64"}]' ||
            inputs.only == 'win32' && '[{"os":"windows-latest","platform":"win32","arch":"x64"}]' ||
            '[{"os":"macos-26","platform":"darwin","arch":"arm64"},{"os":"ubuntu-22.04","platform":"linux","arch":"x64"},{"os":"windows-latest","platform":"win32","arch":"x64"}]'
          ) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # actions: read lets the token download another run's artifacts (the pinned ANGLE builds) and
    # SignPath fetch the workflow artifacts it signs (a `test_sign` dispatch).
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Linux desktop, sandbox and rpm prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2 bubblewrap socat ripgrep rpm rpm2cpio cpio xz-utils
      # Linux node-pty has no spawn-helper until rebuilt; the root postinstall checks it.
      - name: Install Linux dependencies before rebuilding the terminal
        if: runner.os == 'Linux'
        run: npm ci --ignore-scripts
      - if: runner.os != 'Linux'
        run: npm ci
      - name: Install the pinned Linux Electron runtime
        if: runner.os == 'Linux'
        run: node node_modules/electron/install.js
      # Windows packages node-pty's own prebuilds (forge.config.cjs rebuildConfig).
      - if: runner.os != 'Windows'
        run: npm run rebuild:terminal
      - name: Check the Linux runtime after rebuilding the terminal
        if: runner.os == 'Linux'
        run: npm run runtime:check
      # Every Genex build bundles the pinned ANGLE (native/angle/bundle-lock.json): download the
      # lock's angle.yml run; the release build verifies every file and fails closed without them.
      - name: Fetch the pinned ANGLE builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/bundle-angle.mjs --fetch "$RUNNER_TEMP/angle"
          echo "GENEX_ANGLE_DIR=$RUNNER_TEMP/angle" >> "$GITHUB_ENV"
      - name: Make (unsigned)
        if: ${{ !(runner.os == 'Windows' && inputs.test_sign) }}
        run: |
          # nuget and Squirrel stage the app in temp folders (TEMP, SQUIRREL_TEMP) and refuse paths over
          # 260 characters; short ones keep the Genex CLI payload's deepest files under the limit.
          if [ "$RUNNER_OS" = Windows ]; then mkdir -p /d/t && export TMP='D:\t' TEMP='D:\t' SQUIRREL_TEMP='D:\t'; fi
          npm run make -- --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - name: Make, test-signed by SignPath
        if: ${{ runner.os == 'Windows' && inputs.test_sign }}
        uses: ./.github/actions/windows-signpath
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          signing-policy: test-signing
      - name: Pinned ANGLE and sysroot bytes in the actual Linux RPM
        if: runner.os == 'Linux'
        run: |
          mapfile -t rpms < <(find out/make/rpm -type f -name '*.rpm')
          test "${#rpms[@]}" -eq 1
          rpmPayload="$(mktemp -d "$RUNNER_TEMP/genex-rpm.XXXXXX")"
          # The launcher is a link in the package's own file list; extract only the app tree it points into.
          rpm -qplv "${rpms[0]}" | grep -E ' /usr/bin/genex( |$)'
          rpm2cpio "${rpms[0]}" | (cd "$rpmPayload" && cpio -id --no-absolute-filenames --quiet './usr/lib/genex/*')
          node --input-type=module - "$rpmPayload/usr/lib/genex/resources/app.asar.unpacked/dist/resources" "${rpms[0]}" <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { createReadStream } from 'node:fs';
          import { mkdir, writeFile } from 'node:fs/promises';
          import path from 'node:path';
          import { verifyAngleBundle } from './src/substrate/toolchain-store/bundled.ts';
          import { bundledLinuxSysrootFolder, verifyLinuxSysrootFolder, LINUX_SYSROOT_BUNDLE_PIN } from './src/substrate/toolchain-store/linux-sysroot-bundle.ts';
          const angle = await verifyAngleBundle(process.argv[2]);
          assert.equal(angle.length, 3);
          assert.ok(angle.every(check => check.ok), JSON.stringify(angle));
          const checkedSysroot = await verifyLinuxSysrootFolder(bundledLinuxSysrootFolder(process.argv[2]));
          assert.equal(checkedSysroot.manifest.files.length, LINUX_SYSROOT_BUNDLE_PIN.files);
          const sysroot = { pin: LINUX_SYSROOT_BUNDLE_PIN, files: checkedSysroot.manifest.files.length };
          const hash = createHash('sha256');
          for await (const chunk of createReadStream(process.argv[3])) hash.update(chunk);
          const report = { head: process.env.GITHUB_SHA, rpm: path.basename(process.argv[3]), sha256: hash.digest('hex'), angle, sysroot };
          await mkdir('.studio-dev/evidence', { recursive: true });
          await writeFile('.studio-dev/evidence/rpm-payload.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report));
          JS
      # A real per-user install of Genex-Setup.exe, its shortcuts, path lengths and uninstall.
      - name: Squirrel install and uninstall
        if: runner.os == 'Windows'
        run: node tests/e2e/run-squirrel-install.mjs
      # The hosted runner is elevated and disposable, so the one-time sandbox install needs no UAC.
      - name: Windows sandbox setup (srt-sandbox user and WFP filters)
        if: runner.os == 'Windows'
        run: node scripts/ci-windows-sandbox.mjs
      # test:packaged includes the Rust payload checks and, on macOS and Linux, the packaged Rust
      # acceptance (--studio-rust-acceptance); its report lands in .studio-dev/evidence/rust-packaged.
      - name: Packaged smoke (with the Rust acceptance) and packaged terminal
        run: |
          if [ "$RUNNER_OS" = Linux ]; then run="xvfb-run -a"; else run=""; fi
          $run npm run test:packaged
          $run node tests/e2e/run-terminal-packaged.mjs
      - name: Packaged Linux C++ creation
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/e2e/run-cpp-packaged-ui.mjs
      # A whole fixture chat turn (model, tools, workspace, preview) in the installed-shape package,
      # with the harness inside the Windows sandbox.
      - name: Packaged chat turn
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: node tests/e2e/run-electron-e2e.mjs --packaged
      - name: Package sizes
        if: always()
        run: find out/make -type f -exec ls -l {} \; || true
      # The release's version-free Linux copies, so a change in the makers' output fails here first.
      - name: Version-free package names
        if: runner.os == 'Linux'
        run: node scripts/release-downloads.mjs
      - name: Artifact provenance
        run: node scripts/release-manifest.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            out/make/**/*.dmg
            out/make/**/*.zip
            out/make/**/*.deb
            out/make/**/*.rpm
            out/make/squirrel.windows/x64/*.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
            out/make/PROVENANCE-*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: package-${{ matrix.platform }}-evidence
          path: .studio-dev/evidence
          if-no-files-found: ignore
