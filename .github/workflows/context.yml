name: Developer documentation
on:
  pull_request:
  push:
    branches-ignore: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  context:
    if: github.event_name != 'push' || github.event.repository.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # verify:context's agent-settings test runs the boundary hook, which needs TypeScript; the
      # boundary check needs nothing else, so skip install scripts (Electron download, runtime patch).
      - run: npm ci --ignore-scripts
      - run: npm run verify:context
      - run: npm run verify:architecture
      - run: node --test tests/conformance/agent-context.test.ts
